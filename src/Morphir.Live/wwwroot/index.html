<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morphir Live</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- MudBlazor CSS and fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    
    <!-- Monaco Editor CSS -->
    <link href="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.css" rel="stylesheet" />

    <!-- Custom styles for Monaco editor sizing -->
    <style>
        .h-full {
            height: 100% !important;
        }
        /* Ensure Monaco editor and its container fill the parent */
        #morphir-input-editor,
        #morphir-input-editor .monaco-editor {
            height: 100% !important;
            min-height: 100%;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container mt-5">
            <h1>Loading Morphir Live...</h1>
            <p>Please wait while the application loads...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- MudBlazor JavaScript -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    
    <!-- Monaco Editor JavaScript -->
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script>require.config({ paths: { 'vs': '_content/BlazorMonaco/lib/monaco-editor/min/vs' } });</script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
</body>
</html>
