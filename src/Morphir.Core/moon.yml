# moonrepo project configuration for Morphir.Core
# https://moonrepo.dev/docs/config/project

$schema: 'https://moonrepo.dev/schemas/project.json'

# Project metadata
type: 'library'
language: 'dotnet'

# Project dependencies (other moon projects this depends on)
dependsOn: []

# File groups for efficient task input configuration
fileGroups:
  sources:
    - 'src/**/*.cs'
    - '*.csproj'
  configs:
    - '*.csproj'

# Tasks for this project
tasks:
  # Restore NuGet dependencies
  restore:
    command: 'dotnet restore'
    inputs:
      - '@globs(configs)'
      - 'packages.lock.json'
    outputs: []
    options:
      cache: false
      runInCI: true

  # Build the library (Debug configuration)
  build:
    command: 'dotnet build --configuration Debug --no-restore'
    deps:
      - '~:restore'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'bin/Debug/**'
      - 'obj/Debug/**'
    options:
      cache: true
      runInCI: true
      outputStyle: 'stream'

  # Build the library (Release configuration)
  build-release:
    command: 'dotnet build --configuration Release --no-restore'
    deps:
      - '~:restore'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'bin/Release/**'
      - 'obj/Release/**'
    options:
      cache: true
      runInCI: true
      outputStyle: 'stream'

  # Format code
  format:
    command: 'dotnet format'
    inputs:
      - '@globs(sources)'
    options:
      cache: false
      runInCI: false

  # Verify formatting (for CI)
  format-check:
    command: 'dotnet format --verify-no-changes'
    inputs:
      - '@globs(sources)'
    options:
      cache: true
      runInCI: true

  # Clean build outputs
  clean:
    command: 'dotnet clean'
    options:
      cache: false
      runInCI: false

  # Pack as NuGet package (for releases)
  pack:
    command: 'dotnet pack --configuration Release --no-build'
    deps:
      - '~:build-release'
    inputs:
      - '@globs(configs)'
    outputs:
      - 'bin/Release/*.nupkg'
      - 'bin/Release/*.snupkg'
    options:
      cache: true
      runInCI: false
