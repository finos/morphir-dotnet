# moonrepo project configuration for Morphir.Core.Tests
# https://moonrepo.dev/docs/config/project

$schema: 'https://moonrepo.dev/schemas/project.json'

# Project metadata
type: 'application'
language: 'dotnet'

# Project dependencies (other moon projects this depends on)
dependsOn:
  - 'Morphir.Core'

# File groups for efficient task input configuration
fileGroups:
  sources:
    - 'src/**/*.cs'
    - '*.csproj'
  tests:
    - '**/*Tests.cs'
    - '**/*Test.cs'
  features:
    - 'Features/**/*.feature'
  configs:
    - '*.csproj'

# Tasks for this project
tasks:
  # Restore NuGet dependencies
  restore:
    command: 'dotnet restore Morphir.Core.Tests.csproj'
    inputs:
      - '@globs(configs)'
      - 'packages.lock.json'
    outputs: []
    options:
      cache: false
      runInCI: true

  # Build the test project (Debug configuration)
  build:
    command: 'dotnet build Morphir.Core.Tests.csproj --configuration Debug --no-restore'
    deps:
      - 'Morphir.Core:build'
      - '~:restore'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(features)'
      - '@globs(configs)'
    outputs:
      - 'bin/Debug/**'
      - 'obj/Debug/**'
    options:
      cache: true
      runInCI: true
      outputStyle: 'stream'

  # Run tests using TUnit with Microsoft Testing Platform
  # Note: TUnit requires running the test executable directly via dotnet exec
  test:
    command: 'dotnet exec bin/Debug/net10.0/Morphir.Core.Tests.dll'
    deps:
      - '~:build'
    inputs:
      - '@globs(tests)'
      - '@globs(features)'
    outputs: []
    options:
      cache: false
      runInCI: true
      outputStyle: 'stream'
      retryCount: 0

  # Run tests with code coverage
  test-coverage:
    command: 'dotnet exec bin/Debug/net10.0/Morphir.Core.Tests.dll --coverage'
    deps:
      - '~:build'
    inputs:
      - '@globs(tests)'
      - '@globs(features)'
    outputs:
      - 'TestResults/**/*.coverage'
      - 'coverage/**'
    options:
      cache: false
      runInCI: true
      outputStyle: 'stream'

  # Format code
  format:
    command: 'dotnet format Morphir.Core.Tests.csproj'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
    options:
      cache: false
      runInCI: false

  # Verify formatting (for CI)
  format-check:
    command: 'dotnet format Morphir.Core.Tests.csproj --verify-no-changes'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
    options:
      cache: true
      runInCI: true

  # Clean build outputs
  clean:
    command: 'dotnet clean Morphir.Core.Tests.csproj'
    options:
      cache: false
      runInCI: false
