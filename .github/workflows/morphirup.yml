name: "morphirup"

# Proves the morphirup release path on a pull request that can change it: the same build-and-check definition that the
# release workflow runs (morphirup-build.yml), for every platform that releases build, then the checksum file over the
# assets of all of them. The development workflow has no path filters, so this check lives in its own workflow.

on:
    pull_request:
        paths:
            - "src/Morphirup/**"
            - "src/Morphir.Toolchain/**"
            - "tests/Morphir.Toolchain.Tests/AotProbe/**"
            - "build/**"
            - "build.sh"
            - "build.cmd"
            - "build.ps1"
            - "global.json"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "Directory.Packages.props"
            - "src/Directory.Build.props"
            - ".github/workflows/morphirup.yml"
            - ".github/workflows/morphirup-build.yml"
            - ".github/workflows/deployment.yml"

permissions:
    contents: read

jobs:
    build:
        name: release path ${{ matrix.rid }}
        strategy:
            fail-fast: false
            matrix:
                # The platforms of the release workflow's build-executables matrix.
                include:
                    - { rid: linux-x64, os: ubuntu-latest }
                    - { rid: linux-arm64, os: ubuntu-24.04-arm }
                    - { rid: win-x64, os: windows-latest }
                    - { rid: win-arm64, os: windows-11-arm }
                    - { rid: osx-arm64, os: macos-latest }
        uses: ./.github/workflows/morphirup-build.yml
        with:
            rid: ${{ matrix.rid }}
            os: ${{ matrix.os }}

    checksums:
        name: morphirup checksums
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Download the morphirup assets of every platform
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/downloads/morphirup
                  pattern: morphirup-*
                  merge-multiple: false

            - name: Download the Windows toolchain of each Windows platform
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/downloads/windows-toolchain
                  pattern: windows-release-toolchain-*
                  merge-multiple: false

            # The release job's assembly: each Windows producer's SHA256SUMS against its own output, then every output
            # flattened once (refusing two different files under one name), the morphirup checksum file and one
            # SHA256SUMS over both Windows toolchains, each read back by sha256sum. A pull request does not pack the
            # osx-arm64 toolchain (deployment.yml does), so this job requires the two Windows ones only.
            - name: Write and verify the checksum files, as the release job does
              shell: bash
              run: |
                  set -euo pipefail
                  for rid in win-x64 win-arm64; do
                      (cd "./artifacts/downloads/windows-toolchain/windows-release-toolchain-$rid" && sha256sum -c SHA256SUMS)
                  done
                  ./build.sh --target FlattenReleaseAssets MorphirupChecksums WindowsToolchainChecksums \
                      --release-asset-sources ./artifacts/downloads/morphirup/* ./artifacts/downloads/windows-toolchain/* \
                      --windows-toolchain-sources ./artifacts/downloads/windows-toolchain/* --toolchain-platforms win-x64 win-arm64 \
                      --release-assets-dir ./artifacts/release-assets
                  cd ./artifacts/release-assets
                  sha256sum -c morphirup-v*.sha256
                  sha256sum -c SHA256SUMS

    # The win-arm64 output of this run, checked on a native ARM64 runner against its own SHA256SUMS before its manager
    # runs, with the source and checksum record kept for seven days beside the 7-day windows-release-toolchain-win-arm64
    # artifact, so the manager and its checksum file can be downloaded from the pull request.
    verify-win-arm64:
        name: verify win-arm64 output
        needs: [build]
        runs-on: windows-11-arm
        timeout-minutes: 10
        env:
            PROOF_SOURCE_SHA: ${{ github.sha }}
            PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            PROOF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        steps:
            - name: Download this run's complete produced toolchain
              uses: actions/download-artifact@v7
              with:
                  name: windows-release-toolchain-win-arm64
                  path: toolchain

            - name: Verify retained checksums before running the manager
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $root = (Resolve-Path toolchain).Path
                  $checksums = Join-Path $root 'SHA256SUMS'
                  $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                  foreach ($line in Get-Content -LiteralPath $checksums) {
                      if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]*)$') { throw 'Invalid producer checksum line.' }
                      $digest = $Matches[1]
                      $name = $Matches[2]
                      if (!$names.Add($name)) { throw "Duplicate checksum filename: $name" }
                      $file = Join-Path $root $name
                      if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing checksummed file: $name" }
                      if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) { throw "Checksum mismatch: $name" }
                  }
                  if ($names.Count -eq 0) { throw 'Empty producer checksum set.' }
                  foreach ($file in Get-ChildItem -LiteralPath $root -Force) {
                      if ($file.PSIsContainer -or ($file.Name -ne 'SHA256SUMS' -and !$names.Contains($file.Name))) { throw "Uncovered artifact entry: $($file.Name)" }
                  }
                  $os = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
                  $process = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
                  if ($os -ne 'Arm64' -or $process -ne 'Arm64') { throw 'Native execution proof requires ARM64 Windows and PowerShell.' }
                  $candidate = Get-Content (Join-Path $root 'morphir-host-candidate-win-arm64.json') -Raw | ConvertFrom-Json
                  if ($candidate.sourceCommit -ne $env:PROOF_SOURCE_SHA -or $candidate.platform -ne 'win-arm64') { throw 'Produced candidate source or platform differs from this run.' }
                  $manager = Join-Path $root 'morphirup-win-arm64.exe'
                  Add-Type -AssemblyName System.Reflection.Metadata
                  $stream = [IO.File]::OpenRead($manager)
                  try {
                      $pe = [Reflection.PortableExecutable.PEReader]::new($stream)
                      try {
                          $machine = $pe.PEHeaders.CoffHeader.Machine.ToString()
                          if ($machine -ne 'Arm64') { throw 'Manager executable is not ARM64 PE.' }
                      } finally { $pe.Dispose() }
                  } finally { $stream.Dispose() }
                  $version = (& $manager --version | Out-String).Trim()
                  if ($LASTEXITCODE) { throw 'Verified native manager version command failed.' }
                  New-Item -ItemType Directory -Path proof -Force | Out-Null
                  [ordered]@{
                      repository = $env:GITHUB_REPOSITORY
                      runId = $env:GITHUB_RUN_ID
                      runAttempt = $env:GITHUB_RUN_ATTEMPT
                      checkoutSourceSha = $env:PROOF_SOURCE_SHA
                      pullRequestMergeSha = $env:PROOF_SOURCE_SHA
                      pullRequestHeadSha = $env:PROOF_HEAD_SHA
                      pullRequestBaseSha = $env:PROOF_BASE_SHA
                      artifact = 'windows-release-toolchain-win-arm64'
                      checksumFile = 'SHA256SUMS'
                      checksumBodySha256 = (Get-FileHash -LiteralPath $checksums -Algorithm SHA256).Hash.ToLowerInvariant()
                      verifiedFiles = @($names | Sort-Object)
                      osArchitecture = $os
                      proofProcessArchitecture = $process
                      managerPeMachine = $machine
                      managerVersion = $version
                      managerSha256 = (Get-FileHash -LiteralPath $manager -Algorithm SHA256).Hash.ToLowerInvariant()
                      setupSelectRunProof = 'Pending execution on the target machine; no local-developer relabelling of release-checksum inputs.'
                  } | ConvertTo-Json -Depth 5 | Set-Content proof/source-and-checksums.json -Encoding utf8

            - name: Retain source and checksum verification evidence
              uses: actions/upload-artifact@v6
              with:
                  name: preview3-arm64-source-proof
                  path: proof/*
                  if-no-files-found: error
                  retention-days: 7
