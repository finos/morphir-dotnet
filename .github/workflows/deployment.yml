name: "Deployment"

# Workflow-level permissions (minimal by default)
permissions:
    contents: read

on:
    push:
        tags:
            - 'v*'  # Trigger on version tags (e.g., v0.2.1)
    workflow_dispatch:
        inputs:
            configuration:
                description: "Configuration to build"
                required: true
                default: "Release"
                type: string
            release-version:
                description: "Release version following semantic versioning"
                required: true
                default: "0.0.0"
                type: string
            skip-git-release:
                description: "Skip git release"
                required: false
                default: false
                type: boolean

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
    NUGET_TOKEN: ${{ secrets.NUGET_KEY }}

jobs:
    validate-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.extract-version.outputs.version }}
            skip-git-release: ${{ steps.extract-version.outputs.skip-git-release }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0

            - name: Extract version from tag or input
              id: extract-version
              run: |
                  # Extract version from tag (v0.2.1 → 0.2.1) or workflow input
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    VERSION=${GITHUB_REF#refs/tags/v}
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "skip-git-release=false" >> $GITHUB_OUTPUT
                    echo "Extracted version from tag: $VERSION"
                  elif [[ -n "${{ github.event.inputs.release-version }}" ]]; then
                    echo "version=${{ github.event.inputs.release-version }}" >> $GITHUB_OUTPUT
                    echo "skip-git-release=${{ github.event.inputs.skip-git-release }}" >> $GITHUB_OUTPUT
                    echo "Using workflow input version: ${{ github.event.inputs.release-version }}"
                  else
                    echo "Error: No version specified"
                    exit 1
                  fi

            - name: Validate version format
              run: |
                  VERSION=${{ steps.extract-version.outputs.version }}
                  # Validate semantic versioning format
                  if ! echo "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
                    echo "Error: Invalid semantic version format: $VERSION"
                    exit 1
                  fi
                  echo "✓ Version format is valid: $VERSION"

            - name: Validate version is the latest release in CHANGELOG.md
              run: |
                  VERSION=${{ steps.extract-version.outputs.version }}
                  # The build stamps every package and assembly with the latest released
                  # version in CHANGELOG.md, so the requested version must be that one.
                  LATEST=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/' || true)
                  if [ -z "$LATEST" ]; then
                    echo "Error: no released version found in CHANGELOG.md"
                    echo "Run: ./build.sh --target PrepareRelease --release-version $VERSION"
                    exit 1
                  fi
                  if [ "$LATEST" != "$VERSION" ]; then
                    echo "Error: requested version $VERSION is not the latest release in CHANGELOG.md ($LATEST)"
                    echo "Run: ./build.sh --target PrepareRelease --release-version $VERSION and merge it first"
                    exit 1
                  fi
                  echo "✓ Version $VERSION is the latest release in CHANGELOG.md"

    build-executables:
        needs: [validate-version]
        if: ${{ !failure() }}
        timeout-minutes: 60
        strategy:
            matrix:
                include:
                    - rid: linux-x64
                      os: ubuntu-latest
                    - rid: linux-arm64
                      os: ubuntu-24.04-arm
                    - rid: win-x64
                      os: windows-latest
                    - rid: osx-arm64
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore

            - name: Build single-file executable for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target PublishSingleFile --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }} --single-file-dir ./artifacts/single-file

            - name: Run E2E tests for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target TestE2E --executable-type trimmed --configuration ${{ env.CONFIGURATION }}

            - name: Upload executable artifact
              uses: actions/upload-artifact@v6
              with:
                  name: morphir-${{ matrix.rid }}
                  # Upload the RID directory to preserve structure when merged
                  path: ./artifacts/single-file/${{ matrix.rid }}/
                  retention-days: 1

    release:
        runs-on: ubuntu-latest
        needs: [validate-version, build-executables]
        # First of all the release job requires a manual trigger or tag push
        # Second, the release job will only run if it is provided a valid semantic version
        # Third, the release job will only run if the current repository is the main repository
        # when in main repo: all commits to main branch and all additional tags
        # Fourth, E2E tests must pass before release
        if: ${{ !failure() }}

        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              run: ./build.sh --target Restore

            - name: Build
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}

            - name: Download all executable artifacts
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/single-file
                  pattern: morphir-*
                  merge-multiple: true

            - name: Pack library packages
              run: ./build.sh --target PackLibs --configuration ${{ env.CONFIGURATION }}

            - name: Pack tool package
              run: ./build.sh --target PackTool --configuration ${{ env.CONFIGURATION }}

            - name: Run all tests (includes build tests)
              run: ./build.sh --target TestAll --configuration ${{ env.CONFIGURATION }}

            - name: Publish packages to NuGet
              run: ./build.sh --target PublishAll --api-key ${{ env.NUGET_TOKEN }} --nuget-source https://api.nuget.org/v3/index.json

    create-github-release:
        runs-on: ubuntu-latest
        needs: [validate-version, build-executables, release]
        if: ${{ !failure() && needs.validate-version.outputs.skip-git-release != 'true' }}
        # This job needs write permissions to create releases
        permissions:
            contents: write
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0

            - name: Download all executable artifacts
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/executables
                  pattern: morphir-*
                  merge-multiple: false

            - name: List downloaded artifacts
              run: |
                  echo "Downloaded artifacts:"
                  find ./artifacts/executables -type f -ls

            - name: Prepare executables for release
              run: |
                  set -euo pipefail
                  VERSION=${{ needs.validate-version.outputs.version }}
                  mkdir -p ./artifacts/release-assets ./artifacts/tarball-staging

                  # For each platform publish the bare executable and a proto tarball.
                  # The proto plugin downloads morphir-{rid}-v{version}.tar.gz and strips
                  # the {rid}/ prefix (archive_prefix), so the executable must sit under it.
                  for rid in linux-x64 linux-arm64 win-x64 osx-arm64; do
                    artifact_dir="./artifacts/executables/morphir-$rid"
                    if [ -f "$artifact_dir/morphir" ]; then
                      exe=morphir; suffix=""
                    elif [ -f "$artifact_dir/morphir.exe" ]; then
                      exe=morphir.exe; suffix=".exe"
                    else
                      echo "Error: no executable found for $rid in $artifact_dir"
                      exit 1
                    fi

                    # upload-artifact does not keep file permissions
                    chmod +x "$artifact_dir/$exe"
                    cp "$artifact_dir/$exe" "./artifacts/release-assets/morphir-$rid$suffix"

                    mkdir -p "./artifacts/tarball-staging/$rid"
                    cp "$artifact_dir/$exe" "./artifacts/tarball-staging/$rid/$exe"
                    tar -czf "./artifacts/release-assets/morphir-$rid-v$VERSION.tar.gz" \
                      -C ./artifacts/tarball-staging "$rid"
                    echo "✓ $rid: morphir-$rid$suffix and morphir-$rid-v$VERSION.tar.gz"
                  done

                  echo ""
                  echo "Release assets prepared:"
                  ls -lh ./artifacts/release-assets/

            - name: Extract release notes from CHANGELOG.md
              id: extract-notes
              run: |
                  VERSION=${{ needs.validate-version.outputs.version }}

                  # Extract release notes for this version from CHANGELOG.md
                  # Find the section between [VERSION] and the next [VERSION] or end of file
                  awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md > release-notes.md

                  # Check if we got any content
                  if [ ! -s release-notes.md ]; then
                    echo "Warning: No release notes found for version $VERSION"
                    echo "Release $VERSION" > release-notes.md
                  fi

                  echo "Release notes:"
                  cat release-notes.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ needs.validate-version.outputs.version }}
                  name: Release v${{ needs.validate-version.outputs.version }}
                  body_path: release-notes.md
                  draft: false
                  prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
                  files: |
                      ./artifacts/release-assets/morphir-*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    cd:
        runs-on: ubuntu-latest
        needs: [validate-version, release, create-github-release]
        steps:
            - name: Aggregate of deployment jobs
              run: echo "cd passed"
