name: "Deployment"

# Workflow-level permissions (minimal by default)
permissions:
    contents: read

on:
    push:
        tags:
            - 'v*'  # Trigger on version tags (e.g., v0.2.1)
    workflow_dispatch:
        inputs:
            configuration:
                description: "Configuration to build"
                required: true
                default: "Release"
                type: string
            release-version:
                description: "Release version following semantic versioning"
                required: true
                default: "0.0.0"
                type: string
            skip-git-release:
                description: "Skip git release"
                required: false
                default: false
                type: boolean
            dry-run:
                description: "Build every platform and assemble the release assets and checksums, then upload them as an artifact. Publishes nothing."
                required: false
                default: false
                type: boolean

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

# The official Morphir CLI (the morphir-<rid> executables, morphirup and the Morphir.Tool package) is built, qualified
# and published by finos/morphir from a pinned commit of this repository, through .github/workflows/cli-offering.yml.
# This workflow publishes the library packages and the F# extension tools. It builds and publishes the CLI only when
# the repository variable MORPHIR_DOTNET_CLI_PUBLICATION is 'enabled', as a rollback while the parent's channel is
# not live.

jobs:
    validate-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.extract-version.outputs.version }}
            skip-git-release: ${{ steps.extract-version.outputs.skip-git-release }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Extract version from tag or input
              id: extract-version
              run: |
                  # Extract version from tag (v0.2.1 → 0.2.1) or workflow input
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    VERSION=${GITHUB_REF#refs/tags/v}
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "skip-git-release=false" >> $GITHUB_OUTPUT
                    echo "Extracted version from tag: $VERSION"
                  elif [[ -n "${{ github.event.inputs.release-version }}" ]]; then
                    echo "version=${{ github.event.inputs.release-version }}" >> $GITHUB_OUTPUT
                    echo "skip-git-release=${{ github.event.inputs.skip-git-release }}" >> $GITHUB_OUTPUT
                    echo "Using workflow input version: ${{ github.event.inputs.release-version }}"
                  else
                    echo "Error: No version specified"
                    exit 1
                  fi

            - name: Validate version format
              run: |
                  VERSION=${{ steps.extract-version.outputs.version }}
                  # Validate semantic versioning format
                  if ! echo "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
                    echo "Error: Invalid semantic version format: $VERSION"
                    exit 1
                  fi
                  echo "✓ Version format is valid: $VERSION"

            - name: Validate version is the latest release in CHANGELOG.md
              run: |
                  VERSION=${{ steps.extract-version.outputs.version }}
                  # The build stamps every package and assembly with the latest released
                  # version in CHANGELOG.md, so the requested version must be that one.
                  LATEST=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/' || true)
                  if [ -z "$LATEST" ]; then
                    echo "Error: no released version found in CHANGELOG.md"
                    echo "Run: ./build.sh --target PrepareRelease --release-version $VERSION"
                    exit 1
                  fi
                  if [ "$LATEST" != "$VERSION" ]; then
                    echo "Error: requested version $VERSION is not the latest release in CHANGELOG.md ($LATEST)"
                    echo "Run: ./build.sh --target PrepareRelease --release-version $VERSION and merge it first"
                    exit 1
                  fi
                  echo "✓ Version $VERSION is the latest release in CHANGELOG.md"

    build-executables:
        needs: [validate-version]
        if: ${{ !failure() && (vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run) }}
        timeout-minutes: 60
        strategy:
            matrix:
                include:
                    - rid: linux-x64
                      os: ubuntu-latest
                    - rid: linux-arm64
                      os: ubuntu-24.04-arm
                    - rid: win-x64
                      os: windows-latest
                    # The hosted Windows 11 ARM64 runner: win-arm64 is built and tested natively, not cross-built on x64.
                    - rid: win-arm64
                      os: windows-11-arm
                    - rid: osx-arm64
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              # global.json selects the .NET 11 SDK. The .NET 10 SDK adds the .NET 10 runtime, which the tests
              # need to run the net10.0 consumers of the library packages.
              with:
                  dotnet-version: 10.0.x
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            # Fails unless the runner and its .NET SDK are native for the RID, and logs the machine that builds it.
            - name: Check the build machine for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target CheckBuildMachine --rid ${{ matrix.rid }}

            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore

            - name: Build single-file executable for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target PublishSingleFile --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }} --single-file-dir ./artifacts/single-file

            # Every group of tests/Morphir.BlackBox.Tests on the trimmed executable (MORPHIR_TEST_TARGET=trimmed).
            - name: Run the black-box tests on the trimmed executable for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target TestE2E --executable-type trimmed --configuration ${{ env.CONFIGURATION }}

            - name: Upload executable artifact
              uses: actions/upload-artifact@v6
              with:
                  name: morphir-${{ matrix.rid }}
                  # Upload the RID directory to preserve structure when merged
                  path: ./artifacts/single-file/${{ matrix.rid }}/
                  retention-days: 1

    # The morphirup manager, from the same build-and-check definition that the pull request workflow morphirup.yml runs.
    build-morphirup:
        needs: [validate-version]
        if: ${{ !failure() && (vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run) }}
        permissions:
            contents: read
        strategy:
            matrix:
                include:
                    - { rid: linux-x64, os: ubuntu-latest }
                    - { rid: linux-arm64, os: ubuntu-24.04-arm }
                    - { rid: win-x64, os: windows-latest }
                    - { rid: win-arm64, os: windows-11-arm }
                    - { rid: osx-arm64, os: macos-latest }
        uses: ./.github/workflows/morphirup-build.yml
        with:
            rid: ${{ matrix.rid }}
            os: ${{ matrix.os }}
            configuration: ${{ github.event.inputs.configuration || 'Release' }}
            # osx-arm64 also packs its setup toolchain and runs its acquired journey, as the Windows RIDs always do.
            # The pull request workflow does not pass this, so its macOS job stays the manager build only.
            toolchain: true

    release:
        runs-on: ubuntu-latest
        environment: production
        # With CLI publication enabled, nothing is published unless the executables and morphirup built and passed
        # their checks on every platform. Without it, those jobs are skipped and the libraries publish alone.
        needs: [validate-version, build-executables, build-morphirup]
        permissions:
            contents: read
            id-token: write
        # First of all the release job requires a manual trigger or tag push
        # Second, the release job will only run if it is provided a valid semantic version
        # Third, the release job will only run if the current repository is the main repository
        # when in main repo: all commits to main branch and all additional tags
        # Fourth, E2E tests must pass before release
        # Fifth, a dry run publishes nothing: this job holds every NuGet publication and does not run.
        if: ${{ !failure() && !inputs.dry-run }}

        steps:
            - name: Validate trusted publishing configuration
              env:
                  NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
              run: |
                  if [ -z "$NUGET_USER" ]; then
                      echo "::error::Set NUGET_USER to the NuGet username that created the trusted publishing policy for finos/morphir-dotnet and deployment.yml."
                      exit 1
                  fi

            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              # global.json selects the .NET 11 SDK. The .NET 10 SDK adds the .NET 10 runtime, which the tests
              # need to run the net10.0 consumers of the library packages.
              with:
                  dotnet-version: 10.0.x
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              run: ./build.sh --target Restore

            - name: Build
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}

            - name: Download all executable artifacts
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' }}
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/single-file
                  pattern: morphir-*
                  merge-multiple: true

            - name: Pack library packages
              run: ./build.sh --target PackLibs --configuration ${{ env.CONFIGURATION }}

            - name: Pack tool package
              run: ./build.sh --target PackTool --configuration ${{ env.CONFIGURATION }}

            - name: Run all tests (includes build tests)
              run: ./build.sh --target TestAll --configuration ${{ env.CONFIGURATION }}

            # Request the short-lived credential after building and testing so it cannot expire during those steps.
            - name: Authenticate to NuGet with trusted publishing
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              id: nuget-login
              with:
                  user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

            - name: Publish packages to NuGet
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: ./build.sh --target PublishLibs PublishExtensionTools --api-key "$NUGET_API_KEY" --nuget-source https://api.nuget.org/v3/index.json

            - name: Publish the Morphir.Tool CLI package to NuGet
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' }}
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: ./build.sh --target PublishCliTool --api-key "$NUGET_API_KEY" --nuget-source https://api.nuget.org/v3/index.json

    create-github-release:
        runs-on: ubuntu-latest
        needs: [validate-version, build-executables, build-morphirup, release]
        # A dry run assembles the release assets and uploads them instead of creating the release.
        if: ${{ !failure() && (inputs.dry-run || needs.validate-version.outputs.skip-git-release != 'true') }}
        # This job needs write permissions to create releases
        permissions:
            contents: write
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Download all executable artifacts
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/executables
                  pattern: morphir-*
                  merge-multiple: false

            # morphir-* does not match morphirup-* (the eighth character differs), so the two downloads stay apart.
            # Each platform's output lands in a folder of its own; FlattenReleaseAssets copies them into the release
            # assets once and fails on two different files under one name, instead of a silent overwrite.
            - name: Download the morphirup release assets
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/downloads/morphirup
                  pattern: morphirup-*
                  merge-multiple: false

            # The complete toolchain of win-x64, win-arm64 and osx-arm64 (its manager, the nine bundle roles and the
            # producer's SHA256SUMS), uploaded by morphirup-build.yml in build-morphirup, the one producer per RID.
            - name: Download the toolchain of each toolchain platform
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              uses: actions/download-artifact@v7
              with:
                  path: ./artifacts/downloads/windows-toolchain
                  pattern: windows-release-toolchain-*
                  merge-multiple: false

            - name: List downloaded artifacts
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              run: |
                  echo "Downloaded artifacts:"
                  find ./artifacts/executables ./artifacts/downloads -type f -ls

            - name: Prepare executables for release
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              run: |
                  set -euo pipefail
                  VERSION=${{ needs.validate-version.outputs.version }}
                  mkdir -p ./artifacts/release-assets ./artifacts/tarball-staging

                  # For each platform publish the bare executable and a proto tarball.
                  # The proto plugin downloads morphir-{rid}-v{version}.tar.gz and strips
                  # the {rid}/ prefix (archive_prefix), so the executable must sit under it.
                  for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64; do
                    artifact_dir="./artifacts/executables/morphir-$rid"
                    if [ -f "$artifact_dir/morphir" ]; then
                      exe=morphir; suffix=""
                    elif [ -f "$artifact_dir/morphir.exe" ]; then
                      exe=morphir.exe; suffix=".exe"
                    else
                      echo "Error: no executable found for $rid in $artifact_dir"
                      exit 1
                    fi

                    # upload-artifact does not keep file permissions
                    chmod +x "$artifact_dir/$exe"
                    cp "$artifact_dir/$exe" "./artifacts/release-assets/morphir-$rid$suffix"

                    mkdir -p "./artifacts/tarball-staging/$rid"
                    cp "$artifact_dir/$exe" "./artifacts/tarball-staging/$rid/$exe"
                    tar -czf "./artifacts/release-assets/morphir-$rid-v$VERSION.tar.gz" \
                      -C ./artifacts/tarball-staging "$rid"
                    echo "✓ $rid: morphir-$rid$suffix and morphir-$rid-v$VERSION.tar.gz"
                  done

                  echo ""
                  echo "Release assets prepared:"
                  ls -lh ./artifacts/release-assets/

            - name: Setup .NET SDK
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            # Each Windows producer's SHA256SUMS is checked against its own output first. Then every output is flattened
            # once: the manager and notices that morphirup-<rid> and windows-release-toolchain-<rid> both hold come from
            # the same job and must be byte-identical, so a second build of a manager can never replace the bytes a
            # toolchain names. The release then gets the morphirup checksum file and one SHA256SUMS over the three
            # toolchains, and sha256sum reads both back the way a user would.
            - name: Write and verify the checksum files
              if: ${{ vars.MORPHIR_DOTNET_CLI_PUBLICATION == 'enabled' || inputs.dry-run }}
              shell: bash
              run: |
                  set -euo pipefail
                  for rid in win-x64 win-arm64 osx-arm64; do
                      (cd "./artifacts/downloads/windows-toolchain/windows-release-toolchain-$rid" && sha256sum -c SHA256SUMS)
                  done
                  ./build.sh --target FlattenReleaseAssets MorphirupChecksums WindowsToolchainChecksums \
                      --release-asset-sources ./artifacts/downloads/morphirup/* ./artifacts/downloads/windows-toolchain/* \
                      --windows-toolchain-sources ./artifacts/downloads/windows-toolchain/* \
                      --release-assets-dir ./artifacts/release-assets
                  cd ./artifacts/release-assets
                  sha256sum -c "morphirup-v${{ needs.validate-version.outputs.version }}.sha256"
                  sha256sum -c SHA256SUMS

            - name: Extract release notes from CHANGELOG.md
              id: extract-notes
              run: |
                  VERSION=${{ needs.validate-version.outputs.version }}

                  # Extract release notes for this version from CHANGELOG.md
                  # Find the section between [VERSION] and the next [VERSION] or end of file
                  awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md > release-notes.md

                  # Check if we got any content
                  if [ ! -s release-notes.md ]; then
                    echo "Warning: No release notes found for version $VERSION"
                    echo "Release $VERSION" > release-notes.md
                  fi

                  echo "Release notes:"
                  cat release-notes.md

            # Without CLI publication the release has the notes and no CLI assets: the patterns match no file.
            - name: Upload the assembled release assets of the dry run
              if: ${{ inputs.dry-run }}
              uses: actions/upload-artifact@v6
              with:
                  name: dry-run-release-assets
                  path: ./artifacts/release-assets/*
                  if-no-files-found: error
                  retention-days: 7

            - name: Create GitHub Release
              if: ${{ !inputs.dry-run }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ needs.validate-version.outputs.version }}
                  name: Release v${{ needs.validate-version.outputs.version }}
                  body_path: release-notes.md
                  draft: false
                  prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
                  files: |
                      ./artifacts/release-assets/morphir-*
                      ./artifacts/release-assets/morphirup-*
                      ./artifacts/release-assets/SHA256SUMS
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    cd:
        runs-on: ubuntu-latest
        needs: [validate-version, release, create-github-release]
        steps:
            - name: Aggregate of deployment jobs
              run: echo "cd passed"
