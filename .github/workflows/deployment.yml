name: "Deployment"
on:
    workflow_dispatch:
        inputs:
            configuration:
                description: "Configuration to build"
                required: true
                default: "Release"
                type: string
            release-version:
                description: "Release version following semantic versioning"
                required: true
                default: "0.0.0"
                type: string
            skip-git-release:
                description: "Skip git release"
                required: false
                default: false
                type: boolean

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
    RELEASE_VERSION: ${{ github.event.inputs.release-version }}
    NUGET_TOKEN: ${{ secrets.NUGET_KEY }}
    SKIP_GIT_RELEASE: ${{ github.event.inputs.skip-git-release }}
    GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
    validate-release-version:
        runs-on: ubuntu-latest
        steps:
            - name: Check if release_version is valid
              id: check_semver
              uses: actions/github-script@v6
              with:
                  script: |
                      const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$/;
                      const version = process.env.RELEASE_VERSION;
                      if (!semverPattern.test(version)) {
                        core.setFailed(`Invalid semantic version: ${version}`);             
                      }

    build-executables:
        needs: [validate-release-version]
        if: ${{ !failure() }}
        timeout-minutes: 60
        strategy:
            matrix:
                include:
                    - rid: linux-x64
                      os: ubuntu-latest
                    - rid: linux-arm64
                      os: ubuntu-24.04-arm
                    - rid: win-x64
                      os: windows-latest
                    - rid: osx-arm64
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Cache Nuget Packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore

            - name: Build single-file executable for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target PublishSingleFile --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }} --version ${{ env.RELEASE_VERSION }} --single-file-dir ./artifacts/single-file

            - name: Run E2E tests for ${{ matrix.rid }}
              shell: bash
              run: ./build.sh --target TestE2E --executable-type trimmed --configuration ${{ env.CONFIGURATION }}
                  
            - name: Upload executable artifact
              uses: actions/upload-artifact@v4
              with:
                  name: morphir-${{ matrix.rid }}
                  # Upload the RID directory to preserve structure when merged
                  path: ./artifacts/single-file/${{ matrix.rid }}/
                  retention-days: 1

    release:
        runs-on: ubuntu-latest
        needs: [validate-release-version, build-executables]
        # First of all the release job requires a manual trigger
        # Second, the release job will only run if it is provided a valid semantic version
        # Third, the release job will only run if the current repository is the main repository
        # when in main repo: all commits to main branch and all additional tags
        # Fourth, E2E tests must pass before release
        if: ${{ !failure() }}

        steps:
            - name: 🔍 GH_TOKEN
              if: env.GH_TOKEN == ''
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "GH_TOKEN=${GITHUB_TOKEN}" >> $GITHUB_ENV  
              
            - name: Fetch Source Code
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
                  token: ${{ env.GH_TOKEN }}

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            # Not specifying a version will attempt to install via global.json
            - name: Use .NET Core global.json
              uses: actions/setup-dotnet@v5

            - name: Cache Nuget Packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              run: ./build.sh --target Restore

            - name: Build
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}

            - name: Run tests
              run: ./build.sh --target Test --configuration ${{ env.CONFIGURATION }}

            - name: Download all executable artifacts
              uses: actions/download-artifact@v4
              with:
                  path: ./artifacts/single-file
                  pattern: morphir-*
                  merge-multiple: true

            - name: Pack library packages
              run: ./build.sh --target PackLibs --configuration ${{ env.CONFIGURATION }} --version ${{ env.RELEASE_VERSION }}

            - name: Pack tool package
              run: ./build.sh --target PackTool --configuration ${{ env.CONFIGURATION }} --version ${{ env.RELEASE_VERSION }}

            - name: Publish packages to NuGet
              run: ./build.sh --target PublishAll --api-key ${{ env.NUGET_TOKEN }} --nuget-source https://api.nuget.org/v3/index.json

            - name: Create GitHub Release
              if: ${{ env.SKIP_GIT_RELEASE != 'true' }}
              run: ./build.sh --target CreateGitHubRelease --version ${{ env.RELEASE_VERSION }}

    cd:
        runs-on: ubuntu-latest
        needs: [validate-release-version, release]
        steps:
            - name: Aggregate of deployment jobs
              run: echo "cd passed"
