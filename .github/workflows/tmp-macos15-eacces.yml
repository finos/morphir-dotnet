name: "tmp macOS 15 EACCES probe"

# Temporary: reproduces the macOS 15 publication EACCES. Removed before review.
on:
    push:
        branches: [fix/setup-eacces-macos-15]
        paths:
            - ".github/workflows/tmp-macos15-eacces.yml"
            - "src/Morphir.Extensions.Installation/**"
            - "tests/Morphir.Extensions.Installation.Tests/**"

permissions:
    contents: read

jobs:
    probe:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-15, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Rename a 0555 directory within its parent
              shell: bash
              run: |
                  sw_vers
                  uname -a
                  work=$(mktemp -d)
                  mkdir "$work/sealed" "$work/open"
                  chmod 0555 "$work/sealed"
                  if python3 -c 'import os,sys; os.rename(sys.argv[1]+"/sealed", sys.argv[1]+"/sealed-renamed")' "$work"; then echo "sealed rename: ok"; else echo "sealed rename: failed"; fi
                  if python3 -c 'import os,sys; os.rename(sys.argv[1]+"/open", sys.argv[1]+"/open-renamed")' "$work"; then echo "open rename: ok"; else echo "open rename: failed"; fi
                  ls -la "$work"
                  chmod -R u+w "$work"; rm -rf "$work"
            - uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            - name: Package tree tests
              shell: bash
              run: |
                  dotnet build tests/Morphir.Extensions.Installation.Tests/Morphir.Extensions.Installation.Tests.fsproj -c Release -m:1 -p:UseSharedCompilation=false -nodeReuse:false
                  dll=$(ls tests/Morphir.Extensions.Installation.Tests/bin/Release/net11.0/Morphir.Extensions.Installation.Tests.dll)
                  dotnet "$dll" --filter-test-list PackageTrees --sequenced --colours 0
