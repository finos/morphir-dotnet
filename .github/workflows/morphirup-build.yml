name: "morphirup build"

# The one definition of "build and check morphirup for a RID". The pull request workflow morphirup.yml and the release
# workflow deployment.yml both call it, so a pull request runs the exact release path. It publishes morphirup with
# Native AOT (PackMorphirup), checks the produced release assets, not a source build (CheckMorphirup), and uploads them
# as the artifact morphirup-<rid>.

on:
    workflow_call:
        inputs:
            rid:
                description: "The runtime identifier to build, for example linux-x64"
                required: true
                type: string
            os:
                description: "The runner for the RID; Native AOT does not cross-compile between operating systems"
                required: true
                type: string
            configuration:
                description: "The build configuration"
                required: false
                default: "Release"
                type: string
            retention-days:
                description: "How long the uploaded assets are kept"
                required: false
                default: 1
                type: number
            toolchain:
                description: "For osx-arm64, also pack and check the setup toolchain. The release passes true; a pull request does not, to keep its macOS job short. Windows always packs it."
                required: false
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    build:
        name: morphirup ${{ inputs.rid }}
        runs-on: ${{ inputs.os }}
        timeout-minutes: 45
        env:
            DOTNET_PROCESSOR_COUNT: '2'
            MORPHIR_TEST_MAX_PROCESSES: '2'
            DOTNET_CLI_USE_MSBUILD_SERVER: '0'
            MSBUILDDISABLENODEREUSE: '1'
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  # The version comes from CHANGELOG.md and the commit; the build reads both.
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            # Fails unless the runner and its .NET SDK are native for the RID (for win-arm64: the Windows 11 ARM64
            # runner with an ARM64 SDK, not x64 under emulation), and logs the machine that builds the assets.
            - name: Check the build machine for ${{ inputs.rid }}
              shell: bash
              run: ./build.sh --target CheckBuildMachine --rid "${{ inputs.rid }}"

            # CheckMorphirup reads the glibc versions a Linux executable needs with readelf, from binutils.
            - name: Install readelf
              if: runner.os == 'Linux'
              run: command -v readelf || { sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils; }

            - name: Check authenticated Ubuntu bootstrap sequencing
              if: runner.os == 'Linux'
              shell: sh
              run: |
                  set -eu
                  MORPHIR_NATIVE_TEST_ROOT=$(mktemp -d)
                  export MORPHIR_NATIVE_TEST_ROOT
                  trap 'rm -rf "$MORPHIR_NATIVE_TEST_ROOT"' EXIT
                  sh build/tests/ubuntu-native-dependencies.sh

            # The Native AOT link on Windows needs vswhere.exe, which the ILCompiler targets call by name.
            - name: Put vswhere on PATH
              if: runner.os == 'Windows'
              shell: bash
              run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

            - name: Record Windows native toolchain and source
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  PROOF_RID: ${{ inputs.rid }}
                  PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $os = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
                  $process = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
                  "OS architecture: $os; producing PowerShell process architecture: $process"
                  if ($env:PROOF_RID -eq 'win-arm64' -and ($os -ne 'Arm64' -or $process -ne 'Arm64')) { throw 'ARM64 proof requires a native ARM64 producing runner.' }
                  dotnet --info
                  if ($LASTEXITCODE) { throw 'SDK architecture inventory failed.' }
                  $source = (git rev-parse HEAD).Trim()
                  if ($source -ne $env:GITHUB_SHA) { throw 'Checkout source differs from the recorded workflow source.' }
                  "source=$source PR-head=$env:PROOF_HEAD_SHA run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
                  $vswhere = (Get-Command vswhere.exe -ErrorAction Stop).Source
                  & $vswhere -latest -products '*' -format json
                  $installation = (& $vswhere -latest -products '*' -property installationPath).Trim()
                  $version = (Get-Content (Join-Path $installation 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
                  $hostArch = if ($process -eq 'Arm64') { 'Hostarm64' } else { 'Hostx64' }
                  $targetArch = if ($env:PROOF_RID -eq 'win-arm64') { 'arm64' } else { 'x64' }
                  $link = Join-Path $installation "VC/Tools/MSVC/$version/bin/$hostArch/$targetArch/link.exe"
                  $fileVersion = (Get-Item -LiteralPath $link).VersionInfo.FileVersion
                  if ([string]::IsNullOrWhiteSpace($fileVersion)) { throw 'The resolved linker has no FileVersion.' }
                  "Default VC toolset: $version; linker: $link; FileVersion: $fileVersion"
                  $previousNativePreference = $PSNativeCommandUseErrorActionPreference
                  try {
                      $PSNativeCommandUseErrorActionPreference = $false
                      $banner = @(& $link /? 2>&1)
                      $helpExit = $LASTEXITCODE
                  } catch {
                      $banner = @("Linker help unavailable: $($_.Exception.Message)")
                      $helpExit = $LASTEXITCODE
                  } finally {
                      $PSNativeCommandUseErrorActionPreference = $previousNativePreference
                      $global:LASTEXITCODE = 0
                  }
                  "Linker help exit code, diagnostic only: $helpExit"
                  $banner | Select-Object -First 3

            # Diagnose Linux resolver failures without changing the publish network or treating DNS as qualification.
            - name: Diagnose Linux container DNS
              if: runner.os == 'Linux'
              shell: bash
              timeout-minutes: 6
              env:
                  MORPHIRUP_DNS_RID: ${{ inputs.rid }}
              run: |
                  set -uo pipefail
                  image=ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
                  case "$MORPHIRUP_DNS_RID" in
                      linux-x64) repo_hosts=(archive.ubuntu.com security.ubuntu.com) ;;
                      linux-arm64) repo_hosts=(ports.ubuntu.com) ;;
                      *) echo "Unsupported diagnostic RID" >&2; exit 1 ;;
                  esac
                  hosts=("${repo_hosts[@]}" api.nuget.org github.com registry-1.docker.io)
                  containers=()
                  cleanup() {
                      local name status result=0
                      for name in "${containers[@]}"; do
                          if timeout --signal=TERM --kill-after=5s 10s docker rm --force "$name"; then
                              status=0
                          else
                              status=$?
                              result=1
                          fi
                          printf 'container_cleanup name=%s status=%s\n' "$name" "$status"
                      done
                      return "$result"
                  }
                  on_exit() {
                      local status=$?
                      trap - EXIT
                      if ! cleanup; then exit 1; fi
                      exit "$status"
                  }
                  trap on_exit EXIT
                  trap 'exit 130' INT
                  trap 'exit 143' TERM
                  record() {
                      local label="$1" status
                      shift
                      if "$@"; then status=0; else status=$?; fi
                      printf 'diagnostic=%s status=%s\n' "$label" "$status"
                  }
                  printf 'diagnostic_only rid=%s image=%s\n' "$MORPHIRUP_DNS_RID" "$image"
                  record host-architecture timeout --signal=TERM --kill-after=1s 5s uname -m
                  record daemon-version timeout --signal=TERM --kill-after=1s 5s docker version --format 'server={{.Server.Version}} os={{.Server.Os}} arch={{.Server.Arch}}'
                  installed() {
                      local label="$1"
                      shift
                      if command -v "$1" >/dev/null 2>&1; then
                          record "$label" timeout --signal=TERM --kill-after=1s 5s "$@"
                      else
                          printf 'diagnostic=%s status=tool-unavailable\n' "$label"
                      fi
                  }
                  installed host-resolved-status resolvectl --no-pager status
                  installed host-resolved-service systemctl --no-pager show systemd-resolved.service --property=LoadState,ActiveState,SubState,MainPID
                  installed host-dns-listeners ss -4 -H -lnut '( sport = :53 )'
                  installed host-default-route ip -4 route show default
                  record host-repoint-tool-location timeout --signal=TERM --kill-after=1s 5s sh -c 'command -v repoint-resolv-conf'
                  # Inspect routes to the host's first three configured IPv4 resolvers without sending DNS queries.
                  if command -v ip >/dev/null 2>&1; then
                      if resolver_ips=$(timeout --signal=TERM --kill-after=1s 2s sed -n -E 's/^nameserver[[:space:]]+([0-9.]+)([[:space:]]|$).*/\1/p' /etc/resolv.conf); then status=0; else status=$?; fi
                      printf 'diagnostic=host-configured-resolver-read status=%s\n' "$status"
                      resolver_count=0
                      for resolver in $resolver_ips; do
                          if [ "$resolver_count" -ge 3 ]; then break; fi
                          case "$resolver" in
                              *:*|*[!0-9.]*|'') continue ;;
                          esac
                          resolver_count=$((resolver_count + 1))
                          record "host-configured-resolver-route-$resolver" timeout --signal=TERM --kill-after=1s 5s ip -4 route get "$resolver"
                      done
                  fi
                  probe=$(cat <<'PROBE'
                  scope="$1"; shift
                  result=0
                  metadata() {
                      label="$1"; shift
                      if timeout --signal=TERM --kill-after=1s 2s "$@"; then status=0; else status=$?; fi
                      printf 'resolver_metadata scope=%s item=%s status=%s\n' "$scope" "$label" "$status"
                  }
                  metadata os cat /etc/os-release
                  metadata resolver-link ls -l /etc/resolv.conf
                  metadata resolver-target readlink -f /etc/resolv.conf
                  metadata resolver-config cat /etc/resolv.conf
                  metadata hosts-nss-order sed -n '/^[[:space:]]*hosts:/p' /etc/nsswitch.conf
                  metadata ipv4-route-table cat /proc/net/route
                  for host in "$@"; do
                      case "$host" in
                          archive.ubuntu.com|security.ubuntu.com|ports.ubuntu.com) category=ubuntu-repository ;;
                          *) category=workflow-control ;;
                      esac
                      for family in hosts ahostsv4; do
                          printf 'dns_probe_begin scope=%s category=%s name=%s family=%s\n' "$scope" "$category" "$host" "$family"
                          if timeout --signal=TERM --kill-after=1s 2s getent "$family" "$host"; then status=0; else status=$?; fi
                          printf 'dns_probe_end scope=%s category=%s name=%s family=%s status=%s\n' "$scope" "$category" "$host" "$family" "$status"
                          if [ "$status" -ne 0 ]; then result=1; fi
                      done
                  done
                  exit "$result"
                  PROBE
                  )
                  # The outer bound leaves room for every short per-name probe, metadata, and cleanup.
                  record runner-dns timeout --signal=TERM --kill-after=3s 55s sh -c "$probe" sh runner "${hosts[@]}"
                  record pinned-image-pull timeout --signal=TERM --kill-after=5s 20s docker pull "$image"
                  record pinned-image-identity timeout --signal=TERM --kill-after=1s 5s docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$image"
                  for network in bridge host; do
                      name="morphirup-dns-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MORPHIRUP_DNS_RID}-${network}"
                      containers+=("$name")
                      if timeout --signal=TERM --kill-after=5s 10s docker create --pull=never --name "$name" --network "$network" "$image" sh -c "$probe" sh "container-$network" "${hosts[@]}"; then
                          record "container-$network-dns" timeout --signal=TERM --kill-after=3s 55s docker start --attach "$name"
                      else
                          status=$?
                          printf 'diagnostic=%s-create status=%s\n' "$network" "$status"
                      fi
                  done
                  # Resolver statuses are observations. The unchanged publish/check step below remains the gate.

            # A Native AOT executable needs the glibc of the machine that linked it, or newer. So on Linux the publish
            # runs in Ubuntu 22.04 (glibc 2.35), pinned by digest (MorphirupRelease.LinuxBuildImage), not on the
            # runner's own glibc, which moves with the ubuntu-latest label. The image gets clang and the zlib headers
            # there. CheckMorphirup then refuses an executable that needs a glibc above 2.35 and runs it in
            # debian:12-slim (glibc 2.36) and in the build image itself, the floor, after checking that neither image
            # has .NET, libicu, libssl or libcrypto: a Linux executable needs glibc and nothing else. ubuntu:22.04 ships
            # libssl3, which the check purges in a derived image first.
            - name: Build and check morphirup for ${{ inputs.rid }}
              shell: bash
              env:
                  MORPHIRUP_LINUX: ${{ runner.os == 'Linux' && 'true' || '' }}
                  MORPHIRUP_TOOLCHAIN: ${{ inputs.toolchain && 'true' || '' }}
              run: |
                  set -euo pipefail
                  linux=()
                  if [ -n "$MORPHIRUP_LINUX" ]; then
                      linux=(--morphirup-build-image ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
                          --morphirup-containers debian:12-slim ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11)
                  fi
                  targets=(PackMorphirup CheckMorphirup)
                  profile=()
                  if [ "${{ inputs.rid }}" = win-x64 ] || [ "${{ inputs.rid }}" = win-arm64 ] \
                      || { [ "${{ inputs.rid }}" = osx-arm64 ] && [ -n "$MORPHIRUP_TOOLCHAIN" ]; }; then
                      targets=(PackWindowsToolchain CheckMorphirup)
                      profile=(--deployment self-contained)
                  fi
                  ./build.sh --target "${targets[@]}" --rid "${{ inputs.rid }}" --configuration "${{ inputs.configuration }}" ${profile[@]+"${profile[@]}"} ${linux[@]+"${linux[@]}"}

            - name: Exercise the setup composition with actual produced archives
              if: inputs.rid == 'win-x64' || inputs.rid == 'win-arm64' || (inputs.rid == 'osx-arm64' && inputs.toolchain)
              shell: pwsh
              env:
                  MORPHIR_WINDOWS_TOOLCHAIN_ASSETS: ${{ github.workspace }}/artifacts/release-assets
                  MORPHIR_WINDOWS_TOOLCHAIN_RID: ${{ inputs.rid }}
              run: |
                  dotnet build tests/Morphir.Toolchain.Tests/Morphir.Toolchain.Tests.fsproj -c Release -m:1 -p:UseSharedCompilation=false -nodeReuse:false
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  $runner = 'tests/Morphir.Toolchain.Tests/bin/Release/net11.0/Morphir.Toolchain.Tests.dll'
                  $listed = @(dotnet $runner --filter-test-list WindowsReleaseSetup --list-tests --join-with / --colours 0)
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  $expected = @($listed | Where-Object { $_ -match '(^|/)WindowsReleaseSetup/' }).Count
                  if ($expected -le 0) { throw 'No setup tests were discovered.' }
                  dotnet $runner --filter-test-list WindowsReleaseSetup --sequenced --colours 0 2>&1 | Tee-Object -FilePath artifacts/windows-setup-tests.log
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  $plain = [regex]::Replace((Get-Content artifacts/windows-setup-tests.log -Raw), '\x1B\[[0-?]*[ -/]*[@-~]', '')
                  $summary = [regex]::Match($plain, '(\d+) tests run[^\r\n]* [-\u2013] (\d+) passed, (\d+) ignored, (\d+) failed, (\d+) errored')
                  if (!$summary.Success -or [int]$summary.Groups[1].Value -ne $expected -or [int]$summary.Groups[2].Value -ne $expected -or [int]$summary.Groups[3].Value -ne 0 -or [int]$summary.Groups[4].Value -ne 0 -or [int]$summary.Groups[5].Value -ne 0) { throw 'The complete discovered setup group did not pass with zero skips.' }

            # The artifact keeps the name windows-release-toolchain-<rid> for osx-arm64 too, so the release and its
            # checksum jobs download every toolchain with one pattern.
            - name: Upload the complete toolchain proof inputs
              if: inputs.rid == 'win-x64' || inputs.rid == 'win-arm64' || (inputs.rid == 'osx-arm64' && inputs.toolchain)
              uses: actions/upload-artifact@v6
              with:
                  name: windows-release-toolchain-${{ inputs.rid }}
                  path: ./artifacts/release-assets/*
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days < 7 && 7 || inputs.retention-days }}

            - name: Upload the morphirup release assets
              uses: actions/upload-artifact@v6
              with:
                  name: morphirup-${{ inputs.rid }}
                  path: |
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}.exe
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}-v*.tar.gz
                      ./artifacts/release-assets/morphirup-v*-THIRD-PARTY-NOTICES.txt
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days }}
