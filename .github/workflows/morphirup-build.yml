name: "morphirup build"

# The one definition of "build and check morphirup for a RID". The pull request workflow morphirup.yml and the release
# workflow deployment.yml both call it, so a pull request runs the exact release path. It publishes morphirup with
# Native AOT (PackMorphirup), checks the produced release assets, not a source build (CheckMorphirup), and uploads them
# as the artifact morphirup-<rid>.

on:
    workflow_call:
        inputs:
            rid:
                description: "The runtime identifier to build, for example linux-x64"
                required: true
                type: string
            os:
                description: "The runner for the RID; Native AOT does not cross-compile between operating systems"
                required: true
                type: string
            configuration:
                description: "The build configuration"
                required: false
                default: "Release"
                type: string
            retention-days:
                description: "How long the uploaded assets are kept"
                required: false
                default: 1
                type: number

permissions:
    contents: read

jobs:
    build:
        name: morphirup ${{ inputs.rid }}
        runs-on: ${{ inputs.os }}
        timeout-minutes: 45
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  # The version comes from CHANGELOG.md and the commit; the build reads both.
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            # Native AOT on Linux links with clang and needs the zlib headers.
            - name: Install the Native AOT prerequisites
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

            # The Native AOT link on Windows needs vswhere.exe, which the ILCompiler targets call by name.
            - name: Put vswhere on PATH
              if: runner.os == 'Windows'
              shell: bash
              run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

            # On Linux the check also runs the executable in debian:12-slim, which has glibc (2.36) and neither .NET
            # nor libicu, so a build that needs ICU fails here. CheckMorphirup verifies that the image has no libicu.
            - name: Build and check morphirup for ${{ inputs.rid }}
              shell: bash
              env:
                  MORPHIRUP_CONTAINER: ${{ runner.os == 'Linux' && 'debian:12-slim' || '' }}
              run: |
                  set -euo pipefail
                  container=()
                  if [ -n "$MORPHIRUP_CONTAINER" ]; then container=(--morphirup-container "$MORPHIRUP_CONTAINER"); fi
                  ./build.sh --target PackMorphirup CheckMorphirup --rid "${{ inputs.rid }}" --configuration "${{ inputs.configuration }}" "${container[@]}"

            - name: Upload the morphirup release assets
              uses: actions/upload-artifact@v6
              with:
                  name: morphirup-${{ inputs.rid }}
                  path: |
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}.exe
                      ./artifacts/release-assets/morphirup-${{ inputs.rid }}-v*.tar.gz
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days }}
