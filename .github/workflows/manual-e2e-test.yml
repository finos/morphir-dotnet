name: "Manual E2E Testing"

on:
    workflow_dispatch:
        inputs:
            configuration:
                description: "Configuration to build"
                required: true
                default: "Release"
                type: choice
                options:
                    - Release
                    - Debug
            platforms:
                description: "Platforms to test (comma-separated: linux-x64,linux-arm64,osx-arm64,osx-x64,win-x64,win-arm64)"
                required: true
                default: "linux-x64,osx-arm64"
                type: string
            executable-type:
                description: "The target of the black-box tests (MORPHIR_TEST_TARGET): a published executable, the development build with the tool host (tool), a packaged offering or all four (offerings), or the trimmed executable at a path (executable)"
                required: true
                default: "trimmed"
                type: choice
                options:
                    - trimmed
                    - untrimmed
                    - aot
                    - tool
                    - executable
                    - offerings
                    - native-aot
                    - self-contained
                    - framework-dependent
                    - dotnet-tool

env:
    CONFIGURATION: ${{ github.event.inputs.configuration }}

jobs:
    setup:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - name: Parse platform matrix
              id: set-matrix
              run: |
                  # Parse comma-separated platforms into JSON matrix
                  PLATFORMS="${{ github.event.inputs.platforms }}"

                  # Build matrix JSON
                  MATRIX_JSON='{"include":['

                  IFS=',' read -ra PLATFORM_ARRAY <<< "$PLATFORMS"
                  FIRST=true

                  for PLATFORM in "${PLATFORM_ARRAY[@]}"; do
                      PLATFORM=$(echo "$PLATFORM" | xargs) # trim whitespace

                      case "$PLATFORM" in
                          linux-x64)
                              OS="ubuntu-latest"
                              ;;
                          linux-arm64)
                              OS="ubuntu-24.04-arm"
                              ;;
                          osx-x64)
                              OS="macos-15-intel"
                              ;;
                          osx-arm64)
                              OS="macos-latest"
                              ;;
                          win-x64)
                              OS="windows-latest"
                              ;;
                          win-arm64)
                              OS="windows-11-arm"
                              ;;
                          *)
                              echo "Unknown platform: $PLATFORM"
                              continue
                              ;;
                      esac

                      if [ "$FIRST" = false ]; then
                          MATRIX_JSON="${MATRIX_JSON},"
                      fi
                      FIRST=false

                      MATRIX_JSON="${MATRIX_JSON}{\"rid\":\"${PLATFORM}\",\"os\":\"${OS}\"}"
                  done

                  MATRIX_JSON="${MATRIX_JSON}]}"

                  echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
                  echo "Generated matrix: ${MATRIX_JSON}"

    test-executables:
        needs: [setup]
        # offerings packs four profiles and runs the suite four times. On a win-arm64 developer machine that took
        # about 4.5 minutes after the build (native-aot 125 s, self-contained 50 s, framework-dependent 49 s,
        # dotnet-tool 45 s, each with its pack). The 60 minutes allow for the Compile and Restore targets, slower
        # hosted runners and the clean-container pull, with headroom; one offering or the legacy type keeps 30.
        # The Native AOT publish of aot takes longer than the other publishes, so it has the time of offerings.
        timeout-minutes: ${{ (github.event.inputs.executable-type == 'offerings' || github.event.inputs.executable-type == 'aot') && 60 || 30 }}
        strategy:
            fail-fast: false
            matrix: ${{fromJson(needs.setup.outputs.matrix)}}
        runs-on: ${{ matrix.os }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore

            # The Native AOT link on Windows needs vswhere.exe, which the ILCompiler targets call by name.
            - name: Put vswhere on PATH
              if: runner.os == 'Windows'
              shell: bash
              run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

            - name: Build single-file executable for ${{ matrix.rid }}
              if: github.event.inputs.executable-type == 'trimmed'
              shell: bash
              run: ./build.sh --target PublishSingleFile --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }} --single-file-dir ./artifacts/single-file

            # The target executable: one executable at a path, here the trimmed single-file executable published to
            # a folder of its own, with the native host.
            - name: Publish the executable at a path for ${{ matrix.rid }}
              if: github.event.inputs.executable-type == 'executable'
              shell: bash
              run: |
                  ./build.sh --target PublishSingleFile --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }} --single-file-dir ./artifacts/test-executable
                  executable="$PWD/artifacts/test-executable/${{ matrix.rid }}/morphir"
                  [ -f "$executable" ] || executable="$executable.exe"
                  echo "MORPHIR_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
                  echo "MORPHIR_TEST_HOST=native" >> "$GITHUB_ENV"

            # The "No installed .NET runtime" scenario cannot hide a runtime at the default location, which
            # actions/setup-dotnet uses. On Linux it runs in a clean container without .NET instead.
            - name: Pull the clean runtime container
              if: runner.os == 'Linux' && contains(fromJSON('["offerings", "native-aot", "self-contained", "framework-dependent", "dotnet-tool"]'), github.event.inputs.executable-type)
              shell: bash
              run: docker pull mcr.microsoft.com/dotnet/runtime-deps:11.0

            # scripts/run-e2e-tests.cs publishes or packs a target that has no artifact (a packaged offering is packed
            # with PackRelease), then runs every group of tests/Morphir.BlackBox.Tests against it with
            # MORPHIR_TEST_TARGET and MORPHIR_TEST_LANE=published, including EndToEnd/PackagedArtifacts.feature for an
            # offering.
            - name: Run the black-box tests on ${{ github.event.inputs.executable-type }} for ${{ matrix.rid }}
              shell: bash
              env:
                  MORPHIR_E2E_RUNTIME_CONTAINER: ${{ runner.os == 'Linux' && 'mcr.microsoft.com/dotnet/runtime-deps:11.0' || '' }}
              run: ./build.sh --target TestE2E --executable-type ${{ github.event.inputs.executable-type }} --configuration ${{ env.CONFIGURATION }}

            - name: Upload the test reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: black-box-results-${{ github.event.inputs.executable-type }}-${{ matrix.rid }}
                  path: ./artifacts/test-results/black-box/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Upload the packaged-size report and launch metadata
              if: always() && contains(fromJSON('["offerings", "native-aot", "self-contained", "framework-dependent", "dotnet-tool"]'), github.event.inputs.executable-type)
              uses: actions/upload-artifact@v6
              with:
                  name: release-profiles-${{ matrix.rid }}
                  path: |
                      ./artifacts/release/size-report.md
                      ./artifacts/release/*.build-launch.json
                      ./artifacts/release/*.build-contents.json
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Upload executable artifact (on failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: failed-executable-${{ matrix.rid }}
                  path: ./artifacts/single-file/${{ matrix.rid }}/
                  retention-days: 7

            - name: Upload test results (on failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.rid }}
                  path: |
                      **/TestResults/**/*
                      tests/**/bin/${{ env.CONFIGURATION }}/net11.0/*.dll
                  retention-days: 7
