name: Install scripts

# Smoke tests for scripts/install-morphirup.sh and scripts/install-morphirup.ps1. Each job runs the
# scripts from the chosen ref (not from main) against the published finos/morphir releases: once pinned,
# once with no version (the newest release that has morphirup for the runner, which skips the releases of
# the earlier Rust CLI), and twice with a checksum file that must make the script refuse and install
# nothing. Each run must download from https://github.com/finos/morphir/releases/download/. The mise job
# runs the documented mise command. The skipping of releases without morphirup is also checked with no
# network by tests/Morphir.BlackBox.Tests/EndToEnd/InstallScripts.feature.
#
# Manual only, so ordinary pull requests pay nothing for it. Run it after changing the scripts:
#   gh workflow run install-scripts.yml --ref <branch> [-f version=0.5.0-alpha.2] [-f platforms=windows]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'finos/morphir release for the pinned runs, without a leading v. Empty means 0.5.0-alpha.2.'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Which runners to use'
        required: false
        default: all
        type: choice
        options: [all, linux, macos, windows]

permissions:
  contents: read

concurrency:
  group: install-scripts-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED: ${{ inputs.version || '0.5.0-alpha.2' }}
  # Each download of the scripts comes from here.
  SOURCE: https://github.com/finos/morphir/releases/download/
  # Sent to api.github.com only, for the release list the unpinned runs read.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  posix:
    name: sh (${{ matrix.rid }})
    if: inputs.platforms != 'windows'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
        # 'none' matches no runner, so that entry excludes nothing.
        exclude:
          - os: ${{ inputs.platforms == 'macos' && 'ubuntu-latest' || 'none' }}
          - os: ${{ inputs.platforms == 'macos' && 'ubuntu-24.04-arm' || 'none' }}
          - os: ${{ inputs.platforms == 'linux' && 'macos-latest' || 'none' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: ShellCheck (POSIX sh)
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install-morphirup.sh

      - name: Pinned version
        run: |
          sh scripts/install-morphirup.sh --version "$PINNED" --install-dir "$RUNNER_TEMP/pinned" 2> "$RUNNER_TEMP/pinned.log"
          cat "$RUNNER_TEMP/pinned.log"
          grep -q "downloading morphirup-${{ matrix.rid }} $PINNED from ${SOURCE}v$PINNED/morphirup-${{ matrix.rid }}" "$RUNNER_TEMP/pinned.log"
          "$RUNNER_TEMP/pinned/morphirup" --version | tee "$RUNNER_TEMP/pinned.version"
          grep -q "^$PINNED" "$RUNNER_TEMP/pinned.version"

      - name: No version, piped into sh, default install folder
        run: |
          cat scripts/install-morphirup.sh | sh 2> "$RUNNER_TEMP/latest.log"
          cat "$RUNNER_TEMP/latest.log"
          grep -q "from ${SOURCE}v[^/]*/morphirup-${{ matrix.rid }}$" "$RUNNER_TEMP/latest.log"
          "$HOME/.local/bin/morphirup" --version

      - name: Pinned with sh -s -- and wget, under dash
        if: runner.os == 'Linux'
        run: |
          MORPHIRUP_DOWNLOADER=wget dash -s -- --version "v$PINNED" --install-dir "$RUNNER_TEMP/wget" < scripts/install-morphirup.sh
          "$RUNNER_TEMP/wget/morphirup" --version

      - name: Through an HTTPS proxy, and with api.github.com unreachable
        run: |
          python3 -I .github/install-scripts/connect-proxy.py 18080 "$RUNNER_TEMP/proxy.log" &
          sleep 2
          HTTPS_PROXY=http://127.0.0.1:18080 sh scripts/install-morphirup.sh --version "$PINNED" --install-dir "$RUNNER_TEMP/proxied"
          "$RUNNER_TEMP/proxied/morphirup" --version
          cat "$RUNNER_TEMP/proxy.log"
          grep -q 'CONNECT github.com:443' "$RUNNER_TEMP/proxy.log"
          MORPHIRUP_API_URL=https://127.0.0.1:9/releases sh scripts/install-morphirup.sh --install-dir "$RUNNER_TEMP/feed" 2> "$RUNNER_TEMP/feed.log"
          cat "$RUNNER_TEMP/feed.log"
          grep -q 'reading the release feed' "$RUNNER_TEMP/feed.log"
          "$RUNNER_TEMP/feed/morphirup" --version

      - name: A Rust CLI release, which has no morphirup, is refused by name
        run: |
          if sh scripts/install-morphirup.sh --version 0.4.0-beta.12 --install-dir "$RUNNER_TEMP/rust" 2> "$RUNNER_TEMP/rust.log"; then
            echo "::error::the Rust release was accepted"; exit 1
          fi
          cat "$RUNNER_TEMP/rust.log"
          grep -q "finos/morphir release v0.4.0-beta.12 has no morphirup-${{ matrix.rid }}" "$RUNNER_TEMP/rust.log"
          grep -q "morphirup releases before 0.5.0-alpha.2 are on finos/morphir-dotnet" "$RUNNER_TEMP/rust.log"
          [ ! -e "$RUNNER_TEMP/rust/morphirup" ]

      - name: Wrong checksum and missing checksum line are refused
        run: |
          printf '%064d  morphirup-%s\n' 0 "${{ matrix.rid }}" > "$RUNNER_TEMP/wrong.sha256"
          printf '%064d  morphirup-some-other-rid\n' 0 > "$RUNNER_TEMP/missing.sha256"
          for case in wrong missing; do
            if MORPHIRUP_SHA256_FILE="$RUNNER_TEMP/$case.sha256" \
                sh scripts/install-morphirup.sh --version "$PINNED" --install-dir "$RUNNER_TEMP/$case"; then
              echo "::error::the $case checksum was accepted"; exit 1
            fi
            if [ -e "$RUNNER_TEMP/$case/morphirup" ]; then
              echo "::error::the $case checksum installed a file"; exit 1
            fi
            echo "$case checksum refused, nothing installed"
          done

  # The documented mise command. No checkout, so mise does not read this repository's mise.toml, and
  # install: false, so the action installs mise only.
  mise:
    name: mise (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: ${{ (inputs.platforms == 'macos' || inputs.platforms == 'windows') && 'ubuntu-latest' || 'none' }}
          - os: ${{ (inputs.platforms == 'linux' || inputs.platforms == 'windows') && 'macos-latest' || 'none' }}
          - os: ${{ (inputs.platforms == 'linux' || inputs.platforms == 'macos') && 'windows-latest' || 'none' }}
    steps:
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      # version_prefix=v keeps the v* tags; prerelease=true lets mise pick the v* prereleases. mise lists
      # the releases of the earlier Rust CLI too, which have no morphirup, and may hold back a release
      # published in the last day or so; matching=morphirup makes such a pick fail, never install another file.
      - name: mise use -g, no version (the documented command)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mise use -g 'github:finos/morphir[matching=morphirup,version_prefix=v,prerelease=true]'
          mise exec -- morphirup --version | tee version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' version.txt
      - name: mise use -g, with @<version>
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mise use -g "github:finos/morphir[matching=morphirup,version_prefix=v,prerelease=true]@$PINNED"
          mise exec -- morphirup --version | tee version.txt
          grep -q "^$PINNED" version.txt

  windows:
    name: PowerShell (${{ matrix.rid }})
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Pinned version (PowerShell 7)
        shell: pwsh
        run: |
          $log = pwsh -NoProfile -File scripts/install-morphirup.ps1 -Version $env:PINNED -InstallDir "$env:RUNNER_TEMP\pinned" -NoModifyPath 2>&1 | Out-String
          $log
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          if ($log -notmatch "downloading morphirup-${{ matrix.rid }}\.exe $([regex]::Escape($env:PINNED)) from $([regex]::Escape("$($env:SOURCE)v$($env:PINNED)/morphirup-${{ matrix.rid }}.exe"))") { throw 'wrong asset or source' }
          $v = & "$env:RUNNER_TEMP\pinned\morphirup.exe" --version
          $v
          if (-not $v.StartsWith($env:PINNED)) { throw "unexpected version $v" }

      - name: Pinned version (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-morphirup.ps1 -Version "v$env:PINNED" -InstallDir "$env:RUNNER_TEMP\pinned51" -NoModifyPath
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          & "$env:RUNNER_TEMP\pinned51\morphirup.exe" --version

      - name: No version, through iex, default folder and user PATH (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Get-Content -Raw scripts/install-morphirup.ps1 | Invoke-Expression
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\morphirup'
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (-not (($userPath -split ';') -contains $dir)) { throw "user PATH does not have $dir" }
          (Get-Command morphirup).Source
          morphirup --version

      - name: No version, scriptblock form (PowerShell 7)
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content -Raw scripts/install-morphirup.ps1))) -InstallDir "$env:RUNNER_TEMP\latest" -NoModifyPath
          & "$env:RUNNER_TEMP\latest\morphirup.exe" --version

      # The script writes its progress to the standard error of the process, so a child process shows it.
      - name: No version, the newest release comes from finos/morphir (PowerShell 7)
        shell: pwsh
        run: |
          $log = pwsh -NoProfile -File scripts/install-morphirup.ps1 -InstallDir "$env:RUNNER_TEMP\newest" -NoModifyPath 2>&1 | Out-String
          $log
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          if ($log -notmatch "from $([regex]::Escape($env:SOURCE))v[^/]+/morphirup-${{ matrix.rid }}\.exe") { throw 'the newest release did not come from finos/morphir' }
          & "$env:RUNNER_TEMP\newest\morphirup.exe" --version

      - name: Through an HTTPS proxy, and with api.github.com unreachable (both shells)
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\proxy.log"
          $proxy = Start-Process python -ArgumentList '-I', '.github/install-scripts/connect-proxy.py', '18080', $log -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try {
            foreach ($shell in 'pwsh', 'powershell') {
              $before = @(Get-Content $log -ErrorAction SilentlyContinue | Select-String 'CONNECT github.com:443').Count
              $env:HTTPS_PROXY = 'http://127.0.0.1:18080'
              & $shell -NoProfile -ExecutionPolicy Bypass -File scripts/install-morphirup.ps1 -Version $env:PINNED -InstallDir "$env:RUNNER_TEMP\proxied-$shell" -NoModifyPath
              if ($LASTEXITCODE -ne 0) { throw "$shell failed through the proxy" }
              Remove-Item env:HTTPS_PROXY
              $after = @(Get-Content $log | Select-String 'CONNECT github.com:443').Count
              if ($after -le $before) { throw "$shell did not use HTTPS_PROXY" }
              "$shell used the proxy"
              $env:MORPHIRUP_API_URL = 'https://127.0.0.1:9/releases'
              $out = & $shell -NoProfile -ExecutionPolicy Bypass -File scripts/install-morphirup.ps1 -InstallDir "$env:RUNNER_TEMP\feed-$shell" -NoModifyPath 2>&1 | Out-String
              $code = $LASTEXITCODE
              Remove-Item env:MORPHIRUP_API_URL
              $out
              if ($code -ne 0 -or $out -notmatch 'reading the release feed') { throw "$shell did not fall back to the release feed" }
              & "$env:RUNNER_TEMP\feed-$shell\morphirup.exe" --version
            }
            Get-Content $log
          }
          finally {
            Stop-Process -Id $proxy.Id -Force -ErrorAction SilentlyContinue
          }

      - name: A Rust CLI release, which has no morphirup, is refused by name
        shell: pwsh
        run: |
          $out = pwsh -NoProfile -File scripts/install-morphirup.ps1 -Version 0.4.0-beta.12 -InstallDir "$env:RUNNER_TEMP\rust" -NoModifyPath 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          $flat = ($out -replace '(?m)^\s*\|', ' ') -replace '\s+', ' '
          if ($code -eq 0) { throw 'the Rust release was accepted' }
          if ($flat -notmatch 'finos/morphir release v0\.4\.0-beta\.12 has no morphirup-${{ matrix.rid }}\.exe') { throw 'no refusal by name' }
          if ($flat -notmatch 'morphirup releases before 0\.5\.0-alpha\.2 are on finos/morphir-dotnet') { throw 'no pointer to finos/morphir-dotnet' }
          if (Test-Path "$env:RUNNER_TEMP\rust\morphirup.exe") { throw 'installed a file' }
          $global:LASTEXITCODE = 0

      - name: Wrong checksum and missing checksum line are refused
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP\wrong.sha256" ('0' * 64 + '  morphirup-${{ matrix.rid }}.exe') -Encoding ascii
          Set-Content "$env:RUNNER_TEMP\missing.sha256" ('0' * 64 + '  morphirup-some-other-rid.exe') -Encoding ascii
          foreach ($case in 'wrong', 'missing') {
            foreach ($shell in 'pwsh', 'powershell') {
              $env:MORPHIRUP_SHA256_FILE = "$env:RUNNER_TEMP\$case.sha256"
              & $shell -NoProfile -ExecutionPolicy Bypass -File scripts/install-morphirup.ps1 -Version $env:PINNED -InstallDir "$env:RUNNER_TEMP\$case-$shell" -NoModifyPath
              if ($LASTEXITCODE -eq 0) { throw "$shell accepted the $case checksum" }
              if (Test-Path "$env:RUNNER_TEMP\$case-$shell\morphirup.exe") { throw "$shell installed a file with the $case checksum" }
              "$shell refused the $case checksum and installed nothing"
            }
          }
          $global:LASTEXITCODE = 0
