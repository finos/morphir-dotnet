name: "Manual AOT Testing"

on:
    workflow_dispatch:
        inputs:
            configuration:
                description: "Configuration to build"
                required: true
                default: "Release"
                type: choice
                options:
                    - Release
                    - Debug
            platform:
                description: "Platform to test"
                required: true
                default: "linux-x64"
                type: choice
                options:
                    - linux-x64
                    - linux-arm64
                    - osx-arm64
                    - osx-x64
                    - win-x64
                    - win-arm64
            test-suite:
                description: "What to run: the black-box tests on the trimmed and untrimmed executables (trimming), on the Native AOT executable (aot-compilation), on both (both), on the packaged native-aot offering (packaged), or the compile measure"
                required: true
                default: "both"
                type: choice
                options:
                    - both
                    - trimming
                    - aot-compilation
                    - measure-compile
                    - packaged

env:
    CONFIGURATION: ${{ github.event.inputs.configuration }}

jobs:
    aot-tests:
        timeout-minutes: 90
        runs-on: ${{ (github.event.inputs.platform == 'linux-x64' && 'ubuntu-latest') || (github.event.inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm') || (github.event.inputs.platform == 'osx-x64' && 'macos-15-intel') || (github.event.inputs.platform == 'osx-arm64' && 'macos-latest') || (github.event.inputs.platform == 'win-x64' && 'windows-latest') || (github.event.inputs.platform == 'win-arm64' && 'windows-11-arm') || 'ubuntu-latest' }}
        steps:
            - name: Fetch Source Code
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Cache Nuget Packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget

            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore

            # The Native AOT link on Windows needs vswhere.exe, which the ILCompiler targets call by name.
            - name: Put vswhere on PATH
              if: runner.os == 'Windows'
              shell: bash
              run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

            - name: Build the black-box test project
              if: github.event.inputs.test-suite != 'measure-compile'
              shell: bash
              run: ./build.sh --target BuildE2ETests --configuration ${{ env.CONFIGURATION }}

            - name: Build trimmed single-file executable
              if: github.event.inputs.test-suite == 'both' || github.event.inputs.test-suite == 'trimming'
              shell: bash
              run: ./build.sh --target PublishSingleFile --rid ${{ github.event.inputs.platform }} --configuration ${{ env.CONFIGURATION }}

            - name: Build untrimmed single-file executable
              if: github.event.inputs.test-suite == 'both' || github.event.inputs.test-suite == 'trimming'
              shell: bash
              run: ./build.sh --target PublishSingleFileUntrimmed --rid ${{ github.event.inputs.platform }} --configuration ${{ env.CONFIGURATION }}

            - name: Build AOT executable
              if: github.event.inputs.test-suite == 'both' || github.event.inputs.test-suite == 'aot-compilation'
              shell: bash
              run: ./build.sh --target PublishExecutable --rid ${{ github.event.inputs.platform }} --configuration ${{ env.CONFIGURATION }}

            # Every group of tests/Morphir.BlackBox.Tests on each published executable (MORPHIR_TEST_TARGET), with
            # MORPHIR_TEST_LANE=published: the tests with no lane and the tests of the published lane.
            - name: Run the black-box tests on the trimmed and untrimmed executables
              if: github.event.inputs.test-suite == 'both' || github.event.inputs.test-suite == 'trimming'
              shell: bash
              run: |
                  ./build.sh --target TestE2E --executable-type trimmed --configuration ${{ env.CONFIGURATION }}
                  ./build.sh --target TestE2E --executable-type untrimmed --configuration ${{ env.CONFIGURATION }}

            - name: Run the black-box tests on the Native AOT executable
              if: github.event.inputs.test-suite == 'both' || github.event.inputs.test-suite == 'aot-compilation'
              shell: bash
              run: ./build.sh --target TestE2E --executable-type aot --configuration ${{ env.CONFIGURATION }}

            # The native-aot release profile from its packaged archive: PackRelease, then every group of the
            # black-box tests, including EndToEnd/PackagedArtifacts.feature, against the extracted artifact. On Linux
            # the "No installed .NET runtime" scenario runs in a clean container without .NET.
            - name: Check the packaged native-aot artifact
              if: github.event.inputs.test-suite == 'packaged'
              shell: bash
              env:
                  MORPHIR_E2E_RUNTIME_CONTAINER: ${{ runner.os == 'Linux' && 'mcr.microsoft.com/dotnet/runtime-deps:11.0' || '' }}
              run: |
                  ./build.sh --target PackRelease --deployment native-aot --rid ${{ github.event.inputs.platform }} --configuration ${{ env.CONFIGURATION }}
                  ./build.sh --target TestE2E --executable-type native-aot --configuration ${{ env.CONFIGURATION }}
                  cat artifacts/release/size-report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Measure morphir compile (size and wall time)
              if: github.event.inputs.test-suite == 'measure-compile'
              shell: bash
              run: |
                  guest_pkg="$RUNNER_TEMP/guest-pkg"
                  guest_tool="$RUNNER_TEMP/guest-tool"
                  dotnet pack src/Morphir.Frontend.FSharp.Extension -c Release -o "$guest_pkg"
                  cat > "$guest_pkg/nuget.config" <<CONFIG
                  <?xml version="1.0" encoding="utf-8"?>
                  <configuration><packageSources><clear /><add key="local" value="$guest_pkg" /><add key="nuget" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
                  CONFIG
                  version=$(ls "$guest_pkg"/Morphir.Frontend.FSharp.Extension.*.nupkg | head -1 | sed -E 's#.*/Morphir\.Frontend\.FSharp\.Extension\.(.*)\.nupkg#\1#')
                  dotnet tool install Morphir.Frontend.FSharp.Extension --version "$version" --tool-path "$guest_tool" --configfile "$guest_pkg/nuget.config"
                  guest="$guest_tool/morphir-fsharp-frontend"
                  [ -f "$guest" ] || guest="$guest.exe"
                  scripts/measure-compile-aot.sh ${{ github.event.inputs.platform }} "$guest" | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Upload test results (on failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: aot-test-results-${{ github.event.inputs.platform }}
                  path: |
                      ./artifacts/test-results/black-box/
                      **/TestResults/**/*
                      tests/**/bin/${{ env.CONFIGURATION }}/net11.0/*.dll
                  retention-days: 7

            - name: Upload executables (on failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: aot-executables-${{ github.event.inputs.platform }}
                  path: |
                      ./artifacts/release/*.zip
                      ./artifacts/release/*.tar.gz
                      ./artifacts/release/*.json
                      ./artifacts/executables/${{ github.event.inputs.platform }}/
                      ./artifacts/single-file/${{ github.event.inputs.platform }}/
                      ./artifacts/single-file-untrimmed/${{ github.event.inputs.platform }}/
                  retention-days: 7
