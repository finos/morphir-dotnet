name: "Development"

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
    # Manual runs of a branch. GitHub does not count their checks for a pull request: change a ci:* label instead,
    # and ci-request.yml re-runs the pull_request run.
    workflow_dispatch:
        inputs:
            os:
                description: "Platforms besides Linux: auto (all), linux, full, or a list such as windows or windows,macos"
                type: string
                default: auto
    workflow_call:
        inputs:
            configuration:
                description: "The build configuration"
                required: true
                type: string
                default: "Release"
            release-version:
                description: "The release version"
                required: true
                type: string

# A new push to a pull request supersedes its earlier run, so cancel the earlier run. The plan job of the new run
# reuses the jobs that already passed for the same head commit. Calls from other workflows, such as a release, and
# manual runs run to completion.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
    # The Fallout target CIPlan (build/Build.CI.cs, build/Helpers/CiPlan.cs) selects the checks of this run. Linux
    # always runs. A draft adds no platform; a pull request that is ready for review adds Windows and macOS. The
    # ci:windows, ci:macos, ci:full and ci:linux-only labels and the os input change the selection. Jobs that passed
    # in an earlier pull_request run (or attempt) for the same head commit do not run again. The job summaries of plan and ci show the selection.
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
            pull-requests: read
        outputs:
            lint: ${{ steps.plan.outputs.lint }}
            openspec: ${{ steps.plan.outputs.openspec }}
            test: ${{ steps.plan.outputs.test }}
            matrix: ${{ steps.plan.outputs.matrix }}
            selection: ${{ steps.plan.outputs.selection }}
            plan: ${{ steps.plan.outputs.plan }}
        steps:
            - uses: actions/checkout@v6.1.0
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            - name: Plan the checks
              id: plan
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  CI_OS: ${{ inputs.os }}
              run: ./build.sh --target CIPlan ${CI_OS:+--ci-os "$CI_OS"}

    lint:
        needs: plan
        if: needs.plan.outputs.lint == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0
            - name: Setup .NET SDK
              id: setup-dotnet
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            # Restore only: dependency-caches.yml is the one writer of this cache, on main. A cache that a pull
            # request saves is visible to that pull request only, and such caches filled the 10 GB limit of the
            # repository. A miss is not an error: the restore step downloads the packages.
            - name: Restore the NuGet package cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-v3-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-v3-
            - name: Restore dependencies (ignoring lock files due to FSharp.Core NU1403)
              run: DOTNET_RESTORE_LOCKED_MODE=false ./build.sh --target Restore
            - name: Check code formatting
              run: ./build.sh --target Lint
            # About a second, with no restore: dotnet fsi needs only the SDK above.
            # It runs even when restore or formatting fails, so one push reports both problems.
            - name: Check agent skill copies
              if: ${{ !cancelled() && steps.setup-dotnet.outcome == 'success' }}
              run: dotnet fsi scripts/sync-agent-skills.fsx --check
            # The wasm-host features are generated from the pinned corpus in tests/Fixtures/MepWasm.
            # The check generates them again and fails, naming each file and case, when they are
            # stale or edited by hand. Like the skill check, it needs only the SDK.
            - name: Check generated wasm-host features
              if: ${{ !cancelled() && steps.setup-dotnet.outcome == 'success' }}
              run: dotnet fsi scripts/generate-wasm-host-cases.fsx --check

    test:
        needs: plan
        if: needs.plan.outputs.test == 'true'
        strategy:
            matrix:
                os: ${{ fromJSON(needs.plan.outputs.matrix) }}
        runs-on: ${{ matrix.os }}
        env:
            # Managed tests give the same result on each operating system, so a pull request runs them once, on
            # Linux. The other operating systems run only the tests with the PlatformSpecific marker
            # (build/Helpers/TestPlan.cs). A manual run and a call from another workflow run every test on every
            # selected operating system. See docs/contributing/ci-os-matrix.md.
            TEST_SCOPE: ${{ (github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest') && 'platform' || 'all' }}
            # The limit of product processes at the same time for the complete Test run. The build gives each test
            # process a fixed share (build/Helpers/TestPlan.cs). A runner has 3 or 4 processors and runs two test
            # processes at the same time, so 4 gives each one 2, which is the limit that a test process had before
            # the share. With no value the limit is 2 and the share is 1, and the two slowest suites take almost two
            # times as long.
            MORPHIR_TEST_MAX_PROCESSES: 4

        steps:
            - uses: actions/checkout@v6.1.0
            - name: Configure physical test temporary directory
              shell: pwsh
              run: |
                  # macOS defaults to /var/folders through a linked /var ancestor.
                  # Keep input/publication link-refusal tests on the runner-owned path on every OS.
                  foreach ($name in "TMPDIR", "TEMP", "TMP") {
                      "$name=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  }
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              # global.json selects the .NET 11 SDK. The .NET 10 SDK adds the .NET 10 runtime, which the tests
              # need to run the net10.0 consumers of the library packages.
              with:
                  dotnet-version: 10.0.x
                  global-json-file: global.json
            # Restore only: see the lint job. dependency-caches.yml writes one cache for each operating system.
            - name: Restore the NuGet package cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-v3-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-v3-
            - name: Restore dependencies (ignoring lock files due to FSharp.Core NU1403)
              shell: bash
              run: DOTNET_RESTORE_LOCKED_MODE=false ./build.sh --target Restore
            # A committed file that restore rewrites on this OS (for example a packages.lock.json with a host RID
            # target) makes every release artifact record a dirty origin, and the release binding check refuses it.
            - name: Check that restore left the working tree clean
              shell: bash
              run: |
                  changes="$(git status --porcelain --untracked-files=all)"
                  if [ -n "$changes" ]; then
                      echo "::error::Restore changed the working tree on ${{ matrix.os }}:"
                      echo "$changes"
                      git diff
                      exit 1
                  fi
            # The one restore and the one compile of this job. The steps after it skip the Restore and Compile
            # targets (--skip Restore Compile): they use these outputs.
            - name: Build
              shell: bash
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}
            # Green runs take 6 to 14 minutes on each OS (median about 10), so 30 minutes is about 2x the slowest
            # and 3x the median. The TUnit assemblies also take a hang dump after 10 minutes with no test progress
            # (TestHangTimeout); that names the running tests and stops them well before this limit.
            # A detected hang gets one retry below. Any other failure, a timeout included, fails the job.
            - name: Run tests
              id: tests
              shell: bash
              timeout-minutes: 30
              continue-on-error: true
              run: ./build.sh --target Test --configuration ${{ env.CONFIGURATION }} --skip Restore Compile --test-scope "$TEST_SCOPE"
            - name: Upload test results
              if: steps.tests.outcome != 'success'
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.os }}-attempt-${{ github.run_attempt }}
                  path: artifacts/test-results/
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Fail on a test failure
              if: steps.tests.outcome != 'success' && steps.tests.outputs.hang != 'true'
              shell: bash
              run: |
                  echo "::error title=Tests failed::Run tests failed without a detected hang, so it is not retried. See the Run tests step."
                  exit 1
            - name: Retry tests once after a hang
              id: tests-retry
              if: steps.tests.outcome != 'success' && steps.tests.outputs.hang == 'true'
              shell: bash
              timeout-minutes: 30
              run: |
                  echo "::warning title=Test hang retried::Run tests hung. This step runs the tests one more time. The hang report is in the job summary and in the test-results artifact."
                  {
                      echo "### Tests retried once after a hang"
                      echo
                      echo "The first attempt hung (see the hang report above and the \`test-results-${{ matrix.os }}-attempt-${{ github.run_attempt }}\` artifact). A pass of this retry does not fix the hang."
                  } >> "$GITHUB_STEP_SUMMARY"
                  ./build.sh --target Test --configuration ${{ env.CONFIGURATION }} --skip Restore Compile --test-scope "$TEST_SCOPE"
            - name: Upload test results of the retry
              if: failure() && steps.tests-retry.outcome == 'failure'
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.os }}-attempt-${{ github.run_attempt }}-retry
                  path: artifacts/test-results/
                  if-no-files-found: ignore
                  retention-days: 7
            # The F# compiler does not run trim analyzers: publish the generated converters, the MEP C# consumer closure,
            # the morphirup manager and the library hosts with Native AOT, and compare each with its managed run (the
            # Native AOT lane of the black-box tests). One OS is enough: the generated code does not depend on the
            # platform.
            - name: Check generated JSON, MEP and morphirup under Native AOT
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: ./build.sh --target TestAot --configuration ${{ env.CONFIGURATION }} --skip Restore Compile
            - name: Pack packages for build testing
              shell: bash
              run: ./build.sh --target PackAll --configuration ${{ env.CONFIGURATION }} --skip Restore Compile
            - name: Run build tests
              shell: bash
              run: ./build.sh --target TestBuild --configuration ${{ env.CONFIGURATION }} --skip Restore Compile

    openspec:
        name: OpenSpec workflow
        needs: plan
        if: needs.plan.outputs.openspec == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # The action reads its cache but does not save one: dependency-caches.yml saves it on main. Before,
            # each pull request saved its own copy of about 355 MB.
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  cache_save: false
            - name: Check the shared OpenSpec bundle
              run: mise exec -- mission-control-tools openspec check --bundle
            - name: Validate the OpenSpec schema and changes
              run: mise run openspec:validate

    # The Fallout target CIGate fails when a planned job did not succeed, or when a pull request that is ready for
    # review has no passing Windows and macOS tests for its head commit. On a draft it passes with a warning.
    ci:
        runs-on: ubuntu-latest
        needs: [plan, lint, test, openspec]
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6.1.0
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            - name: Evaluate the planned checks
              env:
                  CI_NEEDS: ${{ toJSON(needs) }}
              run: ./build.sh --target CIGate
