name: "Development"

on:
    pull_request:
        types:
            - opened
            - edited
            - synchronize
            - reopened
    workflow_call:
        inputs:
            configuration:
                description: "The build configuration"
                required: true
                type: string
                default: "Release"
            release-version:
                description: "The release version"
                required: true
                type: string

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
    RELEASE_VERSION: ${{ github.event.inputs.release-version }}

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget
            - name: Restore dependencies
              run: ./build.sh --target Restore
            - name: Check code formatting
              run: ./build.sh --target Lint

    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macOS-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6.0.1
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget
            - name: Restore dependencies
              shell: bash
              run: ./build.sh --target Restore
            - name: Build
              shell: bash
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}
            - name: Run tests
              shell: bash
              run: ./build.sh --target Test --configuration ${{ env.CONFIGURATION }}
            - name: Pack packages for build testing
              shell: bash
              run: ./build.sh --target PackAll --configuration ${{ env.CONFIGURATION }}
            - name: Run build tests
              shell: bash
              run: ./build.sh --target TestBuild --configuration ${{ env.CONFIGURATION }}

    ci:
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Aggregate of lint, and all tests
              run: echo "ci passed"
