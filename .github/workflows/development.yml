name: "Development"

on:
    pull_request:
        types:
            - opened
            - edited
            - synchronize
            - reopened
    workflow_call:
        inputs:
            configuration:
                description: "The build configuration"
                required: true
                type: string
                default: "Release"
            release-version:
                description: "The release version"
                required: true
                type: string

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
    RELEASE_VERSION: ${{ github.event.inputs.release-version }}

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            # TEMPORARILY DISABLED: Cache causing NU1403 errors with FSharp.Core.10.0.101
            # Re-enable once cache is stable
            # - uses: actions/cache@v5
            #   with:
            #       path: ~/.nuget/packages
            #       key: ${{ runner.os }}-nuget-v2-${{ hashFiles('**/packages.lock.json') }}
            #       restore-keys: |
            #           ${{ runner.os }}-nuget-v2
            - name: Restore dependencies (ignoring lock files due to FSharp.Core NU1403)
              run: DOTNET_RESTORE_LOCKED_MODE=false ./build.sh --target Restore
            - name: Check code formatting
              run: ./build.sh --target Lint

    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macOS-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6.0.1
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            # TEMPORARILY DISABLED: Cache causing NU1403 errors with FSharp.Core.10.0.101
            # Re-enable once cache is stable
            # - uses: actions/cache@v5
            #   with:
            #       path: ~/.nuget/packages
            #       key: ${{ runner.os }}-nuget-v2-${{ hashFiles('**/packages.lock.json') }}
            #       restore-keys: |
            #           ${{ runner.os }}-nuget-v2
            - name: Restore dependencies (ignoring lock files due to FSharp.Core NU1403)
              shell: bash
              run: DOTNET_RESTORE_LOCKED_MODE=false ./build.sh --target Restore
            - name: Build
              shell: bash
              run: ./build.sh --target Compile --configuration ${{ env.CONFIGURATION }}
            - name: Run tests
              shell: bash
              run: ./build.sh --target Test --configuration ${{ env.CONFIGURATION }}
            - name: Pack packages for build testing
              shell: bash
              run: ./build.sh --target PackAll --configuration ${{ env.CONFIGURATION }}
            - name: Run build tests
              shell: bash
              run: ./build.sh --target TestBuild --configuration ${{ env.CONFIGURATION }}

    openspec:
        name: OpenSpec workflow
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
            - name: Complete the pinned MoonBit SDK and package registry
              run: |
                set -euo pipefail
                curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
                  MOON_HOME="$(mise where http:moonbit)" bash -s -- "$(mise current http:moonbit)"
                mise exec -- moon update

            - name: Verify shared OpenSpec workflow
              run: mise run openspec:verify

    ci:
        runs-on: ubuntu-latest
        needs: [lint, test, openspec]
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Aggregate of lint, and all tests
              run: echo "ci passed"
