name: "Development"

on:
    pull_request:
        types:
            - opened
            - edited
            - synchronize
            - reopened
    workflow_call:
        inputs:
            configuration:
                description: "The build configuration"
                required: true
                type: string
                default: "Debug"
            release-version:
                description: "The release version"
                required: true
                type: string

env:
    CONFIGURATION: ${{ github.event.inputs.configuration || 'Debug' }}
    RELEASE_VERSION: ${{ github.event.inputs.release-version }}

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - name: Install proto CLI
              run: |
                  curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
                  echo "$HOME/.proto/bin" >> $GITHUB_PATH
              shell: bash
            - name: Install moonrepo
              run: |
                  export PATH="$HOME/.proto/bin:$PATH"
                  proto install moonrepo
              shell: bash
            - uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget
            - name: Check code formatting
              run: proto run moonrepo -- run :lint

    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macOS-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6.0.1
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - name: Install proto CLI (Linux/macOS)
              if: runner.os != 'Windows'
              run: |
                  curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
                  echo "$HOME/.proto/bin" >> $GITHUB_PATH
              shell: bash
            - name: Install proto CLI (Windows)
              if: runner.os == 'Windows'
              run: |
                  irm https://moonrepo.dev/install/proto.ps1 | iex
                  echo "$env:USERPROFILE\.proto\bin" >> $env:GITHUB_PATH
              shell: pwsh
            - name: Install moonrepo (Linux/macOS)
              if: runner.os != 'Windows'
              run: |
                  export PATH="$HOME/.proto/bin:$PATH"
                  proto install moonrepo
              shell: bash
            - name: Install moonrepo (Windows)
              if: runner.os == 'Windows'
              run: |
                  $env:PATH = "$env:USERPROFILE\.proto\bin;$env:PATH"
                  proto install moonrepo
              shell: pwsh
            - uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  # Look to see if there is a cache hit for the corresponding requirements file
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget
            - name: Run tests (Linux/macOS)
              if: runner.os != 'Windows'
              run: proto run moonrepo -- run :test-all
            - name: Run tests (Windows)
              if: runner.os == 'Windows'
              run: proto run moonrepo -- run :test-all

    ci:
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - name: Aggregate of lint, and all tests
              run: echo "ci passed"
