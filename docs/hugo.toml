# Hugo configuration file for Docsy theme
baseURL = 'https://finos.github.io/morphir-dotnet/'
title = 'Morphir .NET'
languageCode = 'en-us'
defaultContentLanguage = 'en'

# Enable Google Analytics if needed (uncomment and set your tracking ID)
# googleAnalytics = 'UA-XXXXXXXXX-X'

# Enable git info for "last modified" dates
enableGitInfo = true

# Enable robots.txt
enableRobotsTXT = true

# Enable missing translation placeholders (useful when translating)
enableMissingTranslationPlaceholders = true

# Configure Docsy theme via Hugo modules
# Themes are managed via go.mod and hugo mod commands

# Menu configuration
# Main navigation is now handled by the docs section structure
# Remove these manual menu entries to let Docsy auto-generate from content

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true

# Parameters for Docsy theme
[params]
  # Repository configuration
  github_repo = "https://github.com/finos/morphir-dotnet"
  github_subdir = ""
  github_branch = "main"
  
  # UI configuration
  description = ".NET bindings, libraries, codecs, and tooling for the Morphir ecosystem"
  
  # Search configuration
  [params.search]
    enable = true
    contentLocation = "search-index.json"
    shortFileName = true
  
  # Offline search (Lunr.js)
  offlineSearch = false
  
  # Prism syntax highlighting
  prism_syntax_highlighting = false
  
  # Versioning - disabled for now
  # [params.versions]
  #   [[params.versions]]
  #     version = "main"
  #     url = "/"
  
  # UI theme
  [params.ui]
    breadcrumb_disable = false
    navbar_logo = true
    navbar_translucent_over_cover_disable = false
    sidebar_menu_compact = false
    sidebar_search_disable = false
    showLightDarkModeMenu = true
    [params.ui.feedback]
      enable = true
      "yes" = "Glad to hear it! Please <a href=\"https://github.com/finos/morphir-dotnet/discussions\">tell us how we can improve</a>."
      "no" = "Sorry to hear that. Please <a href=\"https://github.com/finos/morphir-dotnet/issues/new\">tell us how we can improve</a>."
  

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "print", "RSS"]

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Hugo Modules configuration
[module]
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

